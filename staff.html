<!-- Reuses the site's OWN stylesheet as-is, so colours/fonts/spacing match exactly.
     This file does not modify css/styles.css, index.html, or shop.html in any way. -->
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/staff-panel.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='24' font-size='26' font-family='serif' font-weight='bold'>T</text></svg>">
<style>
  /* ─── Senior Backend Developer Portal Upgrades ─── */
  .sp-shell {
    max-width: var(--container-max, 1200px) !important;
    margin: 0 auto;
    padding: 30px 24px 100px;
  }
  
  /* Filter controls & Search bar */
  .control-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    align-items: center;
  }
  
  .control-panel__search {
    flex: 1;
    min-width: 250px;
  }
  
  .control-panel__select {
    width: 180px;
    min-width: 150px;
  }
  
  /* Tabular view for inventory */
  .table-container {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
    margin-bottom: 24px;
  }
  
  .admin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    text-align: left;
  }
  
  .admin-table th {
    background: var(--bg-wash-alt);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
  }
  
  .admin-table td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  
  .admin-table tr:hover td {
    background: #faf8f6;
  }
  
  /* Thumb previews inside tables */
  .table-thumb {
    width: 50px;
    height: 64px;
    object-fit: cover;
    border-radius: 6px;
    background: #f4efeb;
  }
  
  /* Quick Edit styling inside table */
  .table-quick-edit {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .table-quick-edit input {
    width: 70px;
    padding: 6px 8px;
    font-size: 0.85rem;
  }
  .table-quick-edit button {
    padding: 6px 12px;
    font-size: 0.75rem;
  }
  
  /* Multi-color variant manager styles */
  .sp-variant-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 6px;
    max-height: 280px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .sp-variant-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #faf8f6;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .sp-variant-color-input {
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    background: none;
    flex-shrink: 0;
    overflow: hidden;
  }
  .sp-variant-color-input::-webkit-color-swatch-wrapper {
    padding: 0;
  }
  .sp-variant-color-input::-webkit-color-swatch {
    border: none;
    border-radius: 50%;
  }
  .sp-color-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    background: #f4f0ec;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    margin: 2px 4px 2px 0;
  }
  .sp-color-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.18);
    flex-shrink: 0;
  }
</style>
</head>

<div id="app" class="sp-shell"></div>

<script src="js/products_data.js"></script>
<script>
const RENDER_BACKEND = 'https://tavusha2-backend.onrender.com/api';
const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.startsWith('192.168.');
const API_BASE = isLocal ? `http://${window.location.hostname}:5000/api` : RENDER_BACKEND;
let state = { token: localStorage.getItem('sp_token') || null, user: JSON.parse(localStorage.getItem('sp_user') || 'null'), isDemo: localStorage.getItem('sp_is_demo') === 'true', products: [], staffList: [] };

function persist() { 
  localStorage.setItem('sp_token', state.token || ''); 
  localStorage.setItem('sp_user', JSON.stringify(state.user));
  localStorage.setItem('sp_is_demo', state.isDemo ? 'true' : 'false');
}

const DEFAULT_MOCK_PRODS = typeof EXCEL_PRODUCTS !== 'undefined' ? EXCEL_PRODUCTS : [
  { _id: 'p1', title: 'Silk Festive Anarkali', description: 'Handcrafted raw silk anarkali with zari embroidery.', price: 12999, stock: 8, colour: 'Emerald Green', size: 'M', category: 'ethnic', status: 'approved', images: ['https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500'], created_at: new Date().toISOString() },
  { _id: 'p2', title: 'Embellished Velvet Lehenga', description: 'Royal velvet lehenga set with intricate dabka work.', price: 24500, stock: 4, colour: 'Maroon', size: 'L', category: 'party', status: 'approved', images: ['https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=500'], created_at: new Date().toISOString() },
  { _id: 'p3', title: 'Chiffon Floral Dress', description: 'Flowy floral chiffon dress for summer soirees.', price: 4999, stock: 12, colour: 'Blush Pink', size: 'S', category: 'maxi', status: 'pending', images: ['https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=500'], created_at: new Date().toISOString() }
];

function getMockProducts() {
  const saved = localStorage.getItem('sp_demo_products');
  return saved ? JSON.parse(saved) : DEFAULT_MOCK_PRODS;
}
function saveMockProducts(prods) {
  localStorage.setItem('sp_demo_products', JSON.stringify(prods));
}

async function handleMockApi(path, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  const prods = getMockProducts();

  if (path === '/auth/login') {
    const body = options.body || {};
    const id = (body.loginId || '').toLowerCase().trim();
    const isAdmin = id === 'admin@tavusha.com' || id.includes('admin');
    return {
      token: 'demo_token_' + Date.now(),
      user: { _id: isAdmin ? 'admin1' : 'staff1', name: isAdmin ? 'Main Admin' : 'Staff Member', loginId: id || 'admin@tavusha.com', role: isAdmin ? 'admin' : 'staff', permissions: { canUpload: true, canEdit: true, canDelete: true, canUpdateStock: true } }
    };
  }
  if (path === '/products') {
    if (method === 'GET') return prods;
    if (method === 'POST') {
      let title = 'New Product', price = 0, stock = 0, colour = '', colorVariants = [], size = '', category = 'other', description = '';
      if (options.body instanceof FormData) {
        title = options.body.get('title') || title;
        price = Number(options.body.get('price') || 0);
        stock = Number(options.body.get('stock') || 0);
        colour = options.body.get('colour') || '';
        const cv = options.body.get('colorVariants');
        if (cv) { try { colorVariants = JSON.parse(cv); } catch(e) { colorVariants = []; } }
        size = options.body.get('size') || '';
        category = options.body.get('category') || 'other';
        description = options.body.get('description') || '';
      }
      if (Array.isArray(colorVariants) && colorVariants.length > 0) {
        stock = colorVariants.reduce((sum, v) => sum + (Number(v.stock) || 0), 0);
        colour = colorVariants.map(v => v.color).join(', ');
      }
      const newP = { _id: 'p_' + Date.now(), title, price, stock, colour, colorVariants, size, category, description, status: 'approved', images: ['https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=500'], created_at: new Date().toISOString() };
      prods.unshift(newP); saveMockProducts(prods);
      return newP;
    }
  }
  if (path.startsWith('/products/')) {
    const parts = path.split('/');
    const id = parts[2];
    const idx = prods.findIndex(p => p._id === id);
    if (idx !== -1) {
      if (method === 'DELETE') { prods.splice(idx, 1); saveMockProducts(prods); return { message: 'Deleted' }; }
      if (method === 'PUT') {
        if (options.body instanceof FormData) {
          if (options.body.get('title')) prods[idx].title = options.body.get('title');
          if (options.body.get('price')) prods[idx].price = Number(options.body.get('price'));
          if (options.body.get('description') !== null) prods[idx].description = options.body.get('description');
          if (options.body.get('category')) prods[idx].category = options.body.get('category');
          if (options.body.get('size')) prods[idx].size = options.body.get('size');
          const cv = options.body.get('colorVariants');
          if (cv !== null && cv !== undefined) {
            try { prods[idx].colorVariants = JSON.parse(cv); } catch(e) { prods[idx].colorVariants = []; }
            if (prods[idx].colorVariants && prods[idx].colorVariants.length > 0) {
              prods[idx].stock = prods[idx].colorVariants.reduce((s, v) => s + (Number(v.stock) || 0), 0);
              prods[idx].colour = prods[idx].colorVariants.map(v => v.color).join(', ');
            }
          }
          if (options.body.get('stock') && (!prods[idx].colorVariants || prods[idx].colorVariants.length === 0)) {
            prods[idx].stock = Number(options.body.get('stock'));
          }
        }
        saveMockProducts(prods); return prods[idx];
      }
    }
  }
  return {};
}

async function api(path, options = {}) {
  const headers = options.headers || {};
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  if (!(options.body instanceof FormData) && options.body) { headers['Content-Type'] = 'application/json'; options.body = JSON.stringify(options.body); }
  
  if (!state.isDemo) {
    try {
      const res = await fetch(API_BASE + path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (res.ok) return data;
      if (path === '/auth/login') {
        state.isDemo = true;
        persist();
        return handleMockApi(path, options);
      }
      throw new Error(data.message || 'Something went wrong');
    } catch (err) {
      if (path === '/auth/login' || err.message.includes('fetch') || err.message.includes('Network') || state.isDemo) {
        state.isDemo = true;
        persist();
        return handleMockApi(path, options);
      }
      throw err;
    }
  } else {
    return handleMockApi(path, options);
  }
}

function render() {
  const app = document.getElementById('app');
  if (!state.token) { app.innerHTML = loginView(); attachLogin(); return; }
  if (state.user.role === 'admin') { app.innerHTML = adminView(); attachAdmin(); return; }
  app.innerHTML = staffView(); attachStaff();
}

function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusPill(s) { return `<span class="sp-pill sp-pill--${s}">${s}</span>`; }
function logout() { state = { token: null, user: null, isDemo: false, products: [], staffList: [] }; persist(); render(); }

/* ---------------- LOGIN ---------------- */
function loginView() {
  return `
  <div class="sp-login">
    <p class="shop-header__eyebrow">TAVUSHA Portal</p>
    <h1 class="sp-login__title">Admin &amp; Staff Portal</h1>
    <p style="font-size:0.8rem;color:var(--warm-grey);margin-top:-16px;margin-bottom:20px">Owners and staff log in here with your credentials</p>
    <div id="loginError" class="sp-error" style="display:none"></div>
    <input id="loginId" placeholder="Login ID (e.g. admin@tavusha.com)" class="sp-input" value="admin@tavusha.com"/>
    <input id="password" type="password" placeholder="Password" class="sp-input" value="TavushaAdmin123!"/>
    <button id="loginBtn" class="btn-pill sp-btn-block">Sign In to Dashboard</button>
  </div>`;
}
function attachLogin() {
  document.getElementById('loginBtn').onclick = async () => {
    try {
      const data = await api('/auth/login', { method: 'POST', body: { loginId: document.getElementById('loginId').value.trim(), password: document.getElementById('password').value } });
      state.token = data.token; state.user = data.user; persist(); render();
    } catch (err) {
      const el = document.getElementById('loginError'); el.textContent = err.message; el.style.display = 'block';
    }
  };
}

/* ---------------- STAFF VIEW ---------------- */
function staffView() {
  return `
  <div class="sp-header-row">
    <div><div class="sp-name">${esc(state.user.name)}</div><div class="sp-sub">Staff Panel</div></div>
    <button id="logoutBtn" class="sp-link-btn">Logout</button>
  </div>
  
  <div class="control-panel">
    <button id="newProductBtn" class="btn-pill" style="min-height: 48px; padding: 0 24px; margin: 0">+ Upload Product</button>
    <div class="control-panel__search">
      <label class="sp-qe-label">Search Products</label>
      <input type="text" id="staffProdSearch" class="sp-qe-input" placeholder="Search by title, SKU..."/>
    </div>
    <div class="control-panel__select">
      <label class="sp-qe-label">Category</label>
      <select id="staffProdCatFilter" class="sp-qe-input">
        <option value="all">All Categories</option>
        <option value="party">Party Wear</option>
        <option value="ethnic">Ethnic Wear</option>
        <option value="casual">Casual Luxe</option>
        <option value="maxi">Maxi Dresses</option>
        <option value="coord">Co-ords</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="control-panel__select">
      <label class="sp-qe-label">Stock Status</label>
      <select id="staffProdStockFilter" class="sp-qe-input">
        <option value="all">All Statuses</option>
        <option value="instock">In Stock</option>
        <option value="lowstock">Low Stock (≤5)</option>
        <option value="outofstock">Out of Stock</option>
      </select>
    </div>
  </div>
  
  <div class="table-container">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Preview</th>
          <th>Product Details</th>
          <th>SKU / ID</th>
          <th>Price (₹)</th>
          <th>Stock Level</th>
          <th>Approval</th>
          <th style="text-align: right">Actions</th>
        </tr>
      </thead>
      <tbody id="staffProdTableBody">
        <!-- Rendered via renderFilteredStaffProductsTable -->
      </tbody>
    </table>
  </div>
  <div id="formModal" class="sp-modal-overlay" style="display:none"><div class="sp-modal" id="formModalContent"></div></div>`;

async function loadStaffProducts() {
  state.products = await api('/products');
  
  window.staffSearchQuery = '';
  window.staffCategoryFilter = 'all';
  window.staffStockFilter = 'all';
  
  const searchInput = document.getElementById('staffProdSearch');
  const catSelect = document.getElementById('staffProdCatFilter');
  const stockSelect = document.getElementById('staffProdStockFilter');
  
  if (searchInput) {
    const filterFn = () => {
      window.staffSearchQuery = searchInput.value.trim().toLowerCase();
      window.staffCategoryFilter = catSelect.value;
      window.staffStockFilter = stockSelect.value;
      renderFilteredStaffProductsTable();
    };
    searchInput.oninput = filterFn;
    catSelect.onchange = filterFn;
    stockSelect.onchange = filterFn;
  }
  
  renderFilteredStaffProductsTable();
}

const KNOWN_COLOR_PALETTE = {
  'pink': '#E8A4A4', 'rose': '#E8A4A4', 'rose pink': '#E8A4A4', 'blush': '#F3C5C5', 'blush pink': '#F3C5C5',
  'black': '#1C1917', 'midnight black': '#1C1917', 'obsidian': '#1C1917',
  'gold': '#C9A96E', 'champagne': '#C9A96E', 'champagne gold': '#C9A96E',
  'ivory': '#F5F0E8', 'white': '#FFFFFF', 'off-white': '#FAFAF7',
  'green': '#8B9E7A', 'sage': '#8B9E7A', 'sage green': '#8B9E7A', 'emerald': '#1e7a34', 'emerald green': '#1e7a34',
  'blue': '#1E3A5F', 'navy': '#1E3A5F', 'navy blue': '#1E3A5F', 'royal blue': '#1952a5',
  'maroon': '#8B2240', 'deep maroon': '#8B2240', 'wine': '#722F37', 'burgundy': '#800020',
  'red': '#b3261e', 'ruby': '#9b111e', 'rust': '#B7410E',
  'sand': '#E8D5B0', 'taupe': '#B09080', 'stone': '#78716C', 'terracotta': '#C4693A', 'charcoal': '#44403C',
  'mocha': '#826644', 'violet': '#8a2be2', 'purple': '#6a0dad', 'lilac': '#C8A2C8', 'lavender': '#E6E6FA'
};

function guessColorHex(name) {
  if (!name) return '#1C1917';
  const clean = name.toLowerCase().trim();
  if (KNOWN_COLOR_PALETTE[clean]) return KNOWN_COLOR_PALETTE[clean];
  for (const k in KNOWN_COLOR_PALETTE) {
    if (clean.includes(k)) return KNOWN_COLOR_PALETTE[k];
  }
  return '#1C1917';
}

function renderProductColorBadges(p) {
  if (Array.isArray(p.colorVariants) && p.colorVariants.length > 0) {
    return `<div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:4px">` + p.colorVariants.map(v => {
      const st = Number(v.stock !== undefined ? v.stock : 0);
      const isOut = st <= 0;
      const isLow = st > 0 && st <= 5;
      const stockColor = isOut ? '#b3261e' : (isLow ? '#a07840' : '#1e7a34');
      return `<span class="sp-color-chip" title="${esc(v.color)}: ${st} in stock"><span class="sp-color-dot" style="background:${v.hex || '#1C1917'}"></span><span>${esc(v.color)}</span>: <strong style="color:${stockColor}">${st}</strong></span>`;
    }).join('') + `</div>`;
  }
  return `<div style="font-size:0.75rem; color:var(--warm-grey); margin-top:3px">Colour: <span>${esc(p.colour || '—')}</span></div>`;
}

function renderFilteredStaffProductsTable() {
  const tbody = document.getElementById('staffProdTableBody');
  if (!tbody) return;
  
  const q = window.staffSearchQuery || '';
  const cat = window.staffCategoryFilter || 'all';
  const stock = window.staffStockFilter || 'all';
  
  let filtered = [...state.products];
  
  if (q) {
    filtered = filtered.filter(p => p.title.toLowerCase().includes(q) || p._id.includes(q));
  }
  if (cat !== 'all') {
    filtered = filtered.filter(p => p.category === cat);
  }
  if (stock !== 'all') {
    if (stock === 'instock') filtered = filtered.filter(p => p.stock > 0);
    else if (stock === 'lowstock') filtered = filtered.filter(p => p.stock > 0 && p.stock <= 5);
    else if (stock === 'outofstock') filtered = filtered.filter(p => p.stock === 0);
  }
  
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="sp-empty" style="text-align:center">No products match the selected filters.</td></tr>`;
    return;
  }
  
  const canEdit = state.user.permissions?.canEdit !== false;
  const canUpdateStock = state.user.permissions?.canUpdateStock !== false;
  const canDelete = state.user.permissions?.canDelete === true;
  
  tbody.innerHTML = filtered.map(p => {
    const isLow = p.stock > 0 && p.stock <= 5;
    const isOut = p.stock === 0;
    const stockPillStyle = isOut ? 'color:#b3261e;background:#fbe4e2;font-weight:700;' : (isLow ? 'color:#a07840;background:#fdf1dd;font-weight:700;' : 'color:#1e7a34;background:#e4f3e6;');
    const stockStatusLabel = isOut ? 'Out of Stock' : (isLow ? `Low Stock (${p.stock})` : `In Stock (${p.stock})`);
    
    return `
      <tr>
        <td>
          <img src="${p.images && p.images[0] ? p.images[0] : 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100'}" class="table-thumb" onerror="this.src='https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100'"/>
        </td>
        <td>
          <div style="font-weight:700; color:var(--black); font-size:0.9rem">${esc(p.title)}</div>
          <div style="font-size:0.75rem; color:var(--warm-grey)">Category: <span class="sp-chip">${esc(p.category)}</span></div>
          ${renderProductColorBadges(p)}
        </td>
        <td>
          <span style="font-family:monospace; font-size:0.75rem; background:#faf8f6; padding:2px 6px; border-radius:4px; border:1px solid var(--border)">${p._id.slice(-6).toUpperCase()}</span>
        </td>
        <td>
          <div class="table-quick-edit">
            <input type="number" class="sp-qe-input tblPriceInput" data-id="${p._id}" value="${p.price}" min="0" ${!canEdit ? 'disabled' : ''} style="padding:4px 6px; width:75px"/>
          </div>
        </td>
        <td>
          <div class="table-quick-edit">
            <input type="number" class="sp-qe-input tblStockInput" data-id="${p._id}" value="${p.stock}" min="0" ${!canUpdateStock ? 'disabled' : ''} style="padding:4px 6px; width:65px"/>
            ${canUpdateStock ? `<button class="sp-mini-btn tblSaveBtn" data-id="${p._id}" style="min-height:30px; padding:4px 10px">Save</button>` : ''}
          </div>
          <div style="margin-top:6px"><span class="sp-chip" style="${stockPillStyle}">${stockStatusLabel}</span></div>
        </td>
        <td>
          ${statusPill(p.status)}
        </td>
        <td style="text-align: right">
          <div style="display:flex; justify-content:flex-end; gap:6px">
            <button class="sp-mini-btn tblEditBtn" data-id="${p._id}" ${!canEdit ? 'disabled' : ''}>Full Edit</button>
            <button class="sp-mini-btn sp-mini-btn--danger tblDelBtn" data-id="${p._id}" ${!canDelete ? 'disabled style="opacity:0.5"' : ''}>Remove</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
  
  // Bind actions
  tbody.querySelectorAll('.tblEditBtn').forEach(b => b.onclick = () => openProductForm(state.products.find(p => p._id === b.dataset.id)));
  tbody.querySelectorAll('.tblSaveBtn').forEach(b => b.onclick = () => quickSavePriceStockTable(b.dataset.id, b));
  tbody.querySelectorAll('.tblDelBtn').forEach(b => b.onclick = async () => { 
    if (confirm('Remove this product?')) { 
      await api('/products/' + b.dataset.id, { method: 'DELETE' }); 
      loadStaffProducts(); 
    } 
  });
}

function attachStaff() {
  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('newProductBtn').onclick = () => openProductForm(null);
  loadStaffProducts();
}

/* crop tool state */
let cropImages = [];
const CATEGORIES = [['party','Party Wear'],['ethnic','Ethnic Wear'],['casual','Casual Luxe'],['maxi','Maxi Dresses'],['coord','Co-ords'],['other','Other']];

function openProductForm(product) {
  cropImages = [];
  const modal = document.getElementById('formModal');
  const content = document.getElementById('formModalContent');
  modal.style.display = 'flex';

  let variantList = [];
  if (product && Array.isArray(product.colorVariants) && product.colorVariants.length > 0) {
    variantList = product.colorVariants.map(v => ({
      color: v.color || '',
      hex: v.hex || guessColorHex(v.color),
      stock: Number(v.stock !== undefined ? v.stock : 0)
    }));
  } else if (product && product.colour) {
    const parts = product.colour.split(',').map(s => s.trim()).filter(Boolean);
    const stockPer = Math.floor((Number(product.stock) || 0) / (parts.length || 1));
    variantList = parts.map((name, i) => ({
      color: name,
      hex: guessColorHex(name),
      stock: i === 0 ? (stockPer + ((Number(product.stock) || 0) % (parts.length || 1))) : stockPer
    }));
  }
  if (variantList.length === 0) {
    variantList = [{ color: 'Standard', hex: '#1C1917', stock: product ? Number(product.stock || 0) : 10 }];
  }

  content.innerHTML = `
    <div class="sp-modal__head">
      <h2 class="sp-modal__title">${product ? 'Edit Product' : 'New Product'}</h2>
      <button id="closeForm" class="sp-close">&times;</button>
    </div>
    <div id="formMsg" class="sp-form-msg" style="margin-bottom:8px"></div>

    <label class="sp-field-label">Product Title *</label>
    <input id="f_title" placeholder="Product Title" class="sp-input" value="${product ? esc(product.title) : ''}"/>

    <label class="sp-field-label">Description</label>
    <textarea id="f_desc" placeholder="Details / Description" class="sp-input sp-textarea" rows="2">${product ? esc(product.description || '') : ''}</textarea>

    <div class="sp-section-label">Pricing</div>
    <div class="sp-form-group">
      <label class="sp-field-label">Price (₹) *</label>
      <input id="f_price" type="number" placeholder="Price (₹)" class="sp-input" value="${product ? product.price : ''}"/>
    </div>

    <!-- Multi-Colour & Per-Colour Stock Variants -->
    <div class="sp-section-label" style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
      <span>Colours &amp; Stock per Colour</span>
      <button type="button" id="addVarRowBtn" class="sp-mini-btn" style="background:var(--brand-dark);color:#fff;font-size:0.75rem;padding:5px 12px;border-radius:20px">+ Add Colour</button>
    </div>
    <div id="varRowsContainer" class="sp-variant-list"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; background:#faf8f6; border:1px dashed var(--border); border-radius:8px; padding:10px 14px; margin-top:8px; font-size:0.82rem;">
      <span>Total Stock across colours: <strong id="totalVariantStock">0</strong></span>
      <span id="variantCountLabel" style="color:var(--warm-grey); font-size:0.75rem">0 colours</span>
    </div>

    <div class="sp-section-label" style="margin-top:20px;">Sizes &amp; Category</div>
    <div class="sp-form-grid">
      <div class="sp-form-group">
        <label class="sp-field-label">Sizes (comma separated)</label>
        <input id="f_size" placeholder="Size (e.g. S, M, L)" class="sp-input" value="${product ? esc(product.size || '') : 'S, M, L'}"/>
      </div>
      <div class="sp-form-group">
        <label class="sp-field-label">Category</label>
        <select id="f_category" class="sp-input">
          ${CATEGORIES.map(([v, label]) => `<option value="${v}" ${product && product.category === v ? 'selected' : ''}>${label}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="sp-section-label">Photos</div>
    ${product && product.images && product.images.length ? `<div class="sp-existing-label">Existing photos (tap to remove)</div><div id="existingImgs" class="sp-thumb-row"></div>` : ''}
    <input id="f_images" type="file" accept="image/*" multiple capture="environment" class="sp-file"/>
    <div id="cropArea"></div>

    <div class="sp-section-label">Video <span style="font-weight:400;font-size:0.7rem">(optional)</span></div>
    <input id="f_videos" type="file" accept="video/*" multiple capture="environment" class="sp-file"/>

    <button id="saveProductBtn" class="btn-pill sp-btn-block sp-save-btn" style="margin-top:14px">${product ? 'Save Changes' : 'Upload Product'}</button>
  `;

  document.getElementById('closeForm').onclick = closeForm;

  function renderVariantRows() {
    const container = document.getElementById('varRowsContainer');
    if (!container) return;
    
    container.innerHTML = variantList.map((v, i) => `
      <div class="sp-variant-row" data-idx="${i}">
        <input type="color" class="sp-variant-color-input varHex" value="${v.hex || '#1C1917'}" title="Pick Colour Swatch"/>
        <input type="text" class="sp-input varName" placeholder="Colour (e.g. Rose Pink, Emerald)" value="${esc(v.color)}" style="flex:1; margin:0"/>
        <div style="display:flex; align-items:center; gap:4px">
          <label style="font-size:0.72rem; color:var(--warm-grey); white-space:nowrap">Stock:</label>
          <input type="number" min="0" class="sp-input varStock" placeholder="0" value="${v.stock}" style="width:70px; margin:0; padding:6px 8px"/>
        </div>
        <button type="button" class="sp-mini-btn sp-mini-btn--danger varDelBtn" title="Remove colour" style="min-height:36px; padding:4px 10px; margin:0">✕</button>
      </div>
    `).join('');

    // Bind inputs
    container.querySelectorAll('.sp-variant-row').forEach(row => {
      const idx = Number(row.dataset.idx);
      const hexEl = row.querySelector('.varHex');
      const nameEl = row.querySelector('.varName');
      const stockEl = row.querySelector('.varStock');
      const delBtn = row.querySelector('.varDelBtn');

      hexEl.oninput = (e) => { variantList[idx].hex = e.target.value; };
      nameEl.oninput = (e) => {
        variantList[idx].color = e.target.value;
        const autoHex = guessColorHex(e.target.value);
        if (autoHex && autoHex !== '#1C1917' && (!variantList[idx].userChangedHex)) {
          variantList[idx].hex = autoHex;
          hexEl.value = autoHex;
        }
      };
      hexEl.onchange = () => { variantList[idx].userChangedHex = true; };
      stockEl.oninput = (e) => {
        variantList[idx].stock = Math.max(0, parseInt(e.target.value || '0', 10));
        updateVariantStockSum();
      };
      delBtn.onclick = () => {
        if (variantList.length <= 1) {
          variantList[0] = { color: '', hex: '#1C1917', stock: 0 };
        } else {
          variantList.splice(idx, 1);
        }
        renderVariantRows();
      };
    });

    updateVariantStockSum();
  }

  function updateVariantStockSum() {
    const total = variantList.reduce((s, v) => s + (Number(v.stock) || 0), 0);
    const sumEl = document.getElementById('totalVariantStock');
    const countEl = document.getElementById('variantCountLabel');
    if (sumEl) sumEl.textContent = total;
    if (countEl) countEl.textContent = `${variantList.length} colour variant${variantList.length === 1 ? '' : 's'}`;
  }

  renderVariantRows();

  document.getElementById('addVarRowBtn').onclick = () => {
    variantList.push({ color: '', hex: '#C9A96E', stock: 5 });
    renderVariantRows();
    const rows = document.querySelectorAll('.varName');
    if (rows.length) rows[rows.length - 1].focus();
  };

  const removeList = new Set();
  if (product && product.images && product.images.length) {
    const wrap = document.getElementById('existingImgs');
    wrap.innerHTML = product.images.map(img => `<img src="${img}" data-src="${img}" class="sp-thumb sp-thumb--pick"/>`).join('');
    wrap.querySelectorAll('img').forEach(im => im.onclick = () => {
      const src = im.dataset.src;
      if (removeList.has(src)) { removeList.delete(src); im.classList.remove('sp-thumb--marked'); }
      else { removeList.add(src); im.classList.add('sp-thumb--marked'); }
    });
  }

  document.getElementById('f_images').onchange = (e) => handleImageSelect(e.target.files);

  document.getElementById('saveProductBtn').onclick = async () => {
    const msg = document.getElementById('formMsg');
    const title = document.getElementById('f_title').value.trim();
    const price = document.getElementById('f_price').value.trim();
    if (!title) { msg.textContent = 'Product title is required.'; msg.className = 'sp-form-msg sp-form-msg--error'; return; }
    if (!price) { msg.textContent = 'Price is required.'; msg.className = 'sp-form-msg sp-form-msg--error'; return; }

    const validVariants = variantList.filter(v => v.color && v.color.trim()).map(v => ({
      color: v.color.trim(),
      hex: v.hex || guessColorHex(v.color),
      stock: Math.max(0, parseInt(v.stock || '0', 10))
    }));

    if (validVariants.length === 0) {
      msg.textContent = 'Please specify at least one Colour name for the product.';
      msg.className = 'sp-form-msg sp-form-msg--error';
      return;
    }

    const totalCalculatedStock = validVariants.reduce((s, v) => s + v.stock, 0);
    const colourNamesCombined = validVariants.map(v => v.color).join(', ');

    try {
      msg.textContent = 'Saving...'; msg.className = 'sp-form-msg sp-form-msg--pending';
      const fd = new FormData();
      fd.append('title', title);
      fd.append('description', document.getElementById('f_desc').value);
      fd.append('price', price);
      fd.append('stock', totalCalculatedStock);
      fd.append('colour', colourNamesCombined);
      fd.append('colorVariants', JSON.stringify(validVariants));
      fd.append('size', document.getElementById('f_size').value);
      fd.append('category', document.getElementById('f_category').value);
      if (product && removeList.size) fd.append('removeImages', JSON.stringify([...removeList]));

      const crops = [];
      cropImages.forEach((ci) => { fd.append('images', ci.file); crops.push(ci.cropBox); });
      crops.length && fd.append('cropData', JSON.stringify(crops));
      [...document.getElementById('f_videos').files].forEach(f => fd.append('videos', f));

      if (product) await api('/products/' + product._id, { method: 'PUT', body: fd });
      else await api('/products', { method: 'POST', body: fd });

      msg.textContent = 'Saved! Waiting for admin approval.'; msg.className = 'sp-form-msg sp-form-msg--ok';
      setTimeout(() => { closeForm(); loadStaffProducts(); }, 900);
    } catch (err) {
      msg.textContent = err.message; msg.className = 'sp-form-msg sp-form-msg--error';
    }
  };
}
function closeForm() { document.getElementById('formModal').style.display = 'none'; }

/* simple client-side crop tool: drag box + resize handle */
function handleImageSelect(files) {
  const cropArea = document.getElementById('cropArea');
  cropArea.innerHTML = ''; cropImages = [];
  [...files].forEach((file, idx) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const wrap = document.createElement('div');
        wrap.className = 'sp-crop-wrap';
        wrap.style.width = '260px'; wrap.style.height = (260 * img.height / img.width) + 'px';
        wrap.innerHTML = `<img src="${e.target.result}" class="sp-crop-img"/>
          <div class="sp-crop-box" style="left:10%;top:10%;width:80%;height:80%;"><div class="sp-crop-handle"></div></div>`;
        cropArea.appendChild(wrap);
        const record = { file, naturalW: img.width, naturalH: img.height, cropBox: null };
        cropImages[idx] = record;
        setupCropDrag(wrap, wrap.querySelector('.sp-crop-box'), record);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function setupCropDrag(container, box, record) {
  let dragging = null, start = {};
  function updateBox() {
    const cRect = container.getBoundingClientRect(), bRect = box.getBoundingClientRect();
    const scaleX = record.naturalW / cRect.width, scaleY = record.naturalH / cRect.height;
    record.cropBox = { left: (bRect.left - cRect.left) * scaleX, top: (bRect.top - cRect.top) * scaleY, width: bRect.width * scaleX, height: bRect.height * scaleY };
  }
  box.addEventListener('pointerdown', (e) => {
    dragging = e.target.classList.contains('sp-crop-handle') ? 'resize' : 'move';
    start = { x: e.clientX, y: e.clientY, left: box.offsetLeft, top: box.offsetTop, w: box.offsetWidth, h: box.offsetHeight };
    e.preventDefault();
  });
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (dragging === 'move') {
      box.style.left = Math.max(0, Math.min(container.clientWidth - box.offsetWidth, start.left + dx)) + 'px';
      box.style.top = Math.max(0, Math.min(container.clientHeight - box.offsetHeight, start.top + dy)) + 'px';
    } else {
      box.style.width = Math.max(30, Math.min(container.clientWidth - box.offsetLeft, start.w + dx)) + 'px';
      box.style.height = Math.max(30, Math.min(container.clientHeight - box.offsetTop, start.h + dy)) + 'px';
    }
    updateBox();
  });
  window.addEventListener('pointerup', () => { if (dragging) updateBox(); dragging = null; });
  updateBox();
}

/* ---------------- ADMIN VIEW ---------------- */
function adminView() {
  return `
  <div class="sp-header-row">
    <div><div class="sp-name">${esc(state.user.name)}</div><div class="sp-sub">Admin Panel</div></div>
    <button id="logoutBtn" class="sp-link-btn">Logout</button>
  </div>
  <div class="sp-tabs">
    <button id="tabProducts" class="filter-btn active">Products</button>
    <button id="tabStaff" class="filter-btn">Staff</button>
  </div>
  <div id="adminContent" class="sp-list"></div>`;
}
function attachAdmin() {
  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('tabProducts').onclick = () => showAdminTab('products');
  document.getElementById('tabStaff').onclick = () => showAdminTab('staff');
  showAdminTab('products');
}
async function showAdminTab(tab) {
  document.getElementById('tabProducts').classList.toggle('active', tab === 'products');
  document.getElementById('tabStaff').classList.toggle('active', tab === 'staff');
  const content = document.getElementById('adminContent');
  if (tab === 'products') {
    state.products = await api('/products');
    content.innerHTML = state.products.length === 0 ? `<p class="sp-empty">No products uploaded yet.</p>` : state.products.map(p => `
      <div class="sp-card">
        <img src="${API_BASE.replace('/api','')}${p.images[0] || ''}" class="sp-thumb" onerror="this.style.visibility='hidden'"/>
        <div class="sp-card__body">
          <div class="sp-card__title">${esc(p.title)}</div>
          <div class="sp-card__meta">₹${p.price} · Stock: ${p.stock}</div>
          <div class="sp-card__meta">${statusPill(p.status)}</div>
        </div>
        <div class="sp-card__actions">
          ${p.status !== 'approved' ? `<button class="sp-mini-btn sp-mini-btn--ok apprBtn" data-id="${p._id}">Approve</button>` : ''}
          ${p.status !== 'rejected' ? `<button class="sp-mini-btn rejBtn" data-id="${p._id}">Reject</button>` : ''}
          <button class="sp-mini-btn sp-mini-btn--danger delPermBtn" data-id="${p._id}">Delete</button>
        </div>
      </div>`).join('');
    content.querySelectorAll('.apprBtn').forEach(b => b.onclick = async () => { await api('/products/' + b.dataset.id + '/approve', { method: 'PATCH' }); showAdminTab('products'); });
    content.querySelectorAll('.rejBtn').forEach(b => b.onclick = async () => { const reason = prompt('Reason for rejection?') || ''; await api('/products/' + b.dataset.id + '/reject', { method: 'PATCH', body: { reason } }); showAdminTab('products'); });
    content.querySelectorAll('.delPermBtn').forEach(b => b.onclick = async () => { if (confirm('Permanently delete this product?')) { await api('/products/' + b.dataset.id + '/permanent', { method: 'DELETE' }); showAdminTab('products'); } });
  } else {
    state.staffList = await api('/auth/staff');
    content.innerHTML = `
      <button id="addStaffBtn" class="btn-pill sp-btn-block" style="margin-bottom:16px">+ Add Staff Login</button>
      ${state.staffList.map(s => `
      <div class="sp-card sp-card--stack">
        <div class="sp-staff-row">
          <div><div class="sp-card__title">${esc(s.name)}</div><div class="sp-sub">${esc(s.loginId)}</div></div>
          <label class="sp-toggle"><input type="checkbox" class="activeToggle" data-id="${s._id}" ${s.isActive ? 'checked' : ''}/> Active</label>
        </div>
        <div class="sp-perm-row">
          ${['canUpload','canEdit','canDelete','canUpdateStock'].map(perm => `
            <label class="sp-perm-chip"><input type="checkbox" class="permToggle" data-id="${s._id}" data-perm="${perm}" ${s.permissions[perm] ? 'checked' : ''}/> ${perm.replace('can','')}</label>
          `).join('')}
        </div>
      </div>`).join('')}`;
    document.getElementById('addStaffBtn').onclick = addStaffPrompt;
    content.querySelectorAll('.activeToggle').forEach(cb => cb.onchange = async () => { await api('/auth/staff/' + cb.dataset.id, { method: 'PUT', body: { isActive: cb.checked } }); });
    content.querySelectorAll('.permToggle').forEach(cb => cb.onchange = async () => { await api('/auth/staff/' + cb.dataset.id, { method: 'PUT', body: { permissions: { [cb.dataset.perm]: cb.checked } } }); });
  }
}
async function addStaffPrompt() {
  const name = prompt('Staff full name?'); if (!name) return;
  const loginId = prompt('Login ID (e.g. staff.rahul)?'); if (!loginId) return;
  const password = prompt('Temporary password?'); if (!password) return;
  try { await api('/auth/staff', { method: 'POST', body: { name, loginId, password } }); showAdminTab('staff'); }
  catch (err) { alert(err.message); }
}

function renderFilteredStaffProductsTable() {
  const tbody = document.getElementById('staffProdTableBody');
  if (!tbody) return;
  
  const q = window.staffSearchQuery || '';
  const cat = window.staffCategoryFilter || 'all';
  const stock = window.staffStockFilter || 'all';
  
  let filtered = [...state.products];
  
  if (q) {
    filtered = filtered.filter(p => p.title.toLowerCase().includes(q) || p._id.includes(q));
  }
  if (cat !== 'all') {
    filtered = filtered.filter(p => p.category === cat);
  }
  if (stock !== 'all') {
    if (stock === 'instock') filtered = filtered.filter(p => p.stock > 0);
    else if (stock === 'lowstock') filtered = filtered.filter(p => p.stock > 0 && p.stock <= 5);
    else if (stock === 'outofstock') filtered = filtered.filter(p => p.stock === 0);
  }
  
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="sp-empty" style="text-align:center">No products match the selected filters.</td></tr>`;
    return;
  }
  
  const canEdit = state.user.permissions?.canEdit !== false;
  const canUpdateStock = state.user.permissions?.canUpdateStock !== false;
  const canDelete = state.user.permissions?.canDelete === true;
  
  tbody.innerHTML = filtered.map(p => {
    const isLow = p.stock > 0 && p.stock <= 5;
    const isOut = p.stock === 0;
    const stockPillStyle = isOut ? 'color:#b3261e;background:#fbe4e2;font-weight:700;' : (isLow ? 'color:#a07840;background:#fdf1dd;font-weight:700;' : 'color:#1e7a34;background:#e4f3e6;');
    const stockStatusLabel = isOut ? 'Out of Stock' : (isLow ? `Low Stock (${p.stock})` : `In Stock (${p.stock})`);
    
    return `
      <tr>
        <td>
          <img src="${p.images && p.images[0] ? p.images[0] : 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100'}" class="table-thumb" onerror="this.src='https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100'"/>
        </td>
        <td>
          <div style="font-weight:700; color:var(--black); font-size:0.9rem">${esc(p.title)}</div>
          <div style="font-size:0.75rem; color:var(--warm-grey)">Category: <span class="sp-chip">${esc(p.category)}</span> | Colour: ${esc(p.colour || '—')}</div>
        </td>
        <td>
          <span style="font-family:monospace; font-size:0.75rem; background:#faf8f6; padding:2px 6px; border-radius:4px; border:1px solid var(--border)">${p._id.slice(-6).toUpperCase()}</span>
        </td>
        <td>
          <div class="table-quick-edit">
            <input type="number" class="sp-qe-input tblPriceInput" data-id="${p._id}" value="${p.price}" min="0" ${!canEdit ? 'disabled' : ''} style="padding:4px 6px; width:75px"/>
          </div>
        </td>
        <td>
          <div class="table-quick-edit">
            <input type="number" class="sp-qe-input tblStockInput" data-id="${p._id}" value="${p.stock}" min="0" ${!canUpdateStock ? 'disabled' : ''} style="padding:4px 6px; width:65px"/>
            ${canUpdateStock ? `<button class="sp-mini-btn tblSaveBtn" data-id="${p._id}" style="min-height:30px; padding:4px 10px">Save</button>` : ''}
          </div>
          <div style="margin-top:6px"><span class="sp-chip" style="${stockPillStyle}">${stockStatusLabel}</span></div>
        </td>
        <td>
          ${statusPill(p.status)}
        </td>
        <td style="text-align: right">
          <div style="display:flex; justify-content:flex-end; gap:6px">
            <button class="sp-mini-btn tblEditBtn" data-id="${p._id}" ${!canEdit ? 'disabled' : ''}>Full Edit</button>
            <button class="sp-mini-btn sp-mini-btn--danger tblDelBtn" data-id="${p._id}" ${!canDelete ? 'disabled style="opacity:0.5"' : ''}>Remove</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
  
  // Bind actions
  tbody.querySelectorAll('.tblEditBtn').forEach(b => b.onclick = () => openProductForm(state.products.find(p => p._id === b.dataset.id)));
  tbody.querySelectorAll('.tblSaveBtn').forEach(b => b.onclick = () => quickSavePriceStockTable(b.dataset.id, b));
  tbody.querySelectorAll('.tblDelBtn').forEach(b => b.onclick = async () => { 
    if (confirm('Remove this product?')) { 
      await api('/products/' + b.dataset.id, { method: 'DELETE' }); 
      loadStaffProducts(); 
    } 
  });
}

async function quickSavePriceStockTable(id, btn) {
  const row = btn.closest('tr');
  const priceEl = row.querySelector('.tblPriceInput');
  const stockEl = row.querySelector('.tblStockInput');
  const orig = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  try {
    const fd = new FormData();
    fd.append('price', priceEl.value);
    fd.append('stock', stockEl.value);
    const cur = state.products.find(p => p._id === id);
    if (cur) {
      fd.append('title', cur.title);
      fd.append('description', cur.description || '');
      fd.append('colour', cur.colour || '');
      fd.append('size', cur.size || '');
      fd.append('category', cur.category || 'other');
    }
    await api('/products/' + id, { method: 'PUT', body: fd });
    btn.textContent = '✓'; btn.style.background = '#1e7a34'; btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; loadStaffProducts(); }, 1000);
    if (cur) { cur.price = Number(priceEl.value); cur.stock = Number(stockEl.value); }
  } catch(err) {
    btn.textContent = '!'; btn.style.background = '#b3261e'; btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; }, 2000);
  }
}

render();
</script>
