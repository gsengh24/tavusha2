  /* ─── Senior Backend Developer Portal Upgrades ─── */
  .sp-shell {
    max-width: var(--container-max, 1200px) !important;
    margin: 0 auto;
    padding: 30px 24px 100px;
  }
  
  /* Filter controls & Search bar */
  .control-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    align-items: center;
  }
  
  .control-panel__search {
    flex: 1;
    min-width: 250px;
  }
  
  .control-panel__select {
    width: 180px;
    min-width: 150px;
  }
  
  /* Tabular view for inventory & orders */
  .table-container {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
    margin-bottom: 24px;
  }
  
  .admin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    text-align: left;
  }
  
  .admin-table th {
    background: var(--bg-wash-alt);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
  }
  
  .admin-table td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  
  .admin-table tr:hover td {
    background: #faf8f6;
  }
  
  /* Thumb previews inside tables */
  .table-thumb {
    width: 50px;
    height: 64px;
    object-fit: cover;
    border-radius: 6px;
    background: #f4efeb;
  }
  
  /* Poster Spread CMS Grid */
  .poster-layout-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-top: 12px;
  }
  
  .poster-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  
  .poster-card__title {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--brand-dark);
    margin-bottom: 14px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  /* General CMS elements */
  .cms-group {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    background: var(--white);
  }
  .cms-group__title {
    font-size: 1.1rem;
    font-family: var(--font-display);
    font-weight: 700;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cms-item-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    background: #faf8f6;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .cms-item-card img {
    width: 60px;
    height: 80px;
    object-fit: cover;
    border-radius: 4px;
    background: #e6e6e6;
  }
  .cms-item-card__body {
    flex: 1;
    font-size: 0.85rem;
  }
  .cms-item-card__title {
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--black);
  }
  .cms-item-card__meta {
    font-size: 0.75rem;
    color: var(--warm-grey);
  }
  
  .sp-order-item {
    font-size: 0.8rem;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
    display: flex;
    justify-content: space-between;
  }
  .sp-order-item:last-child {
    border-bottom: none;
  }
  
  /* Quick Edit styling inside table */
  .table-quick-edit {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .table-quick-edit input {
    width: 70px;
    padding: 6px 8px;
    font-size: 0.85rem;
  }
  .table-quick-edit button {
    padding: 6px 12px;
    font-size: 0.75rem;
  }
</style>

// ─── MOCK API REQUEST HANDLER ──────────────────────────────────────────────
async function handleMockApi(path, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  
  if (path === '/auth/login') {
    const body = options.body || {};
    const id = (body.loginId || '').toLowerCase().trim();
    const isAdmin = id === 'admin@tavusha.com' || id.includes('admin');
    return {
      token: 'demo_token_' + Date.now(),
      user: { _id: isAdmin ? 'admin1' : 'staff1', name: isAdmin ? 'Main Admin' : 'Staff Member', loginId: id || 'admin@tavusha.com', role: isAdmin ? 'admin' : 'staff', permissions: { canUpload: true, canEdit: true, canDelete: true, canUpdateStock: true } }
    };
  }
  
  if (path === '/products') {
    const prods = getLocal('sp_demo_products', DEFAULT_MOCK_PRODS);
    if (method === 'GET') return prods;
    if (method === 'POST') {
      let title = 'New Product', price = 0, stock = 0, colour = '', size = '', category = 'other', description = '';
      if (options.body instanceof FormData) {
        title = options.body.get('title') || title;
        price = Number(options.body.get('price') || 0);
        stock = Number(options.body.get('stock') || 0);
        colour = options.body.get('colour') || '';
        size = options.body.get('size') || '';
        category = options.body.get('category') || 'other';
        description = options.body.get('description') || '';
      } else if (options.body) {
        title = options.body.title || title;
        price = Number(options.body.price || 0);
        stock = Number(options.body.stock || 0);
        colour = options.body.colour || '';
        size = options.body.size || '';
        category = options.body.category || 'other';
        description = options.body.description || '';
      }
      const newP = { _id: 'p_' + Date.now(), title, price, stock, colour, size, category, description, status: 'approved', images: ['https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=500'], created_at: new Date().toISOString() };
      prods.unshift(newP); setLocal('sp_demo_products', prods);
      return newP;
    }
  }
  
  if (path.startsWith('/products/')) {
    const parts = path.split('/');
    const id = parts[2];
    const sub = parts[3];
    const prods = getLocal('sp_demo_products', DEFAULT_MOCK_PRODS);
    const idx = prods.findIndex(p => p._id === id);
    if (idx !== -1) {
      if (sub === 'approve') { prods[idx].status = 'approved'; setLocal('sp_demo_products', prods); return prods[idx]; }
      if (sub === 'reject') { prods[idx].status = 'rejected'; setLocal('sp_demo_products', prods); return prods[idx]; }
      if (method === 'DELETE') { prods.splice(idx, 1); setLocal('sp_demo_products', prods); return { message: 'Deleted' }; }
      if (method === 'PUT') {
        if (options.body instanceof FormData) {
          if (options.body.get('title')) prods[idx].title = options.body.get('title');
          if (options.body.get('price')) prods[idx].price = Number(options.body.get('price'));
          if (options.body.get('stock')) prods[idx].stock = Number(options.body.get('stock'));
        } else if (options.body) {
          if (options.body.title) prods[idx].title = options.body.title;
          if (options.body.price) prods[idx].price = Number(options.body.price);
          if (options.body.stock) prods[idx].stock = Number(options.body.stock);
        }
        setLocal('sp_demo_products', prods); return prods[idx];
      }
    }
  }
  
  if (path === '/auth/staff') {
    const staff = getLocal('sp_demo_staff', DEFAULT_MOCK_STAFF);
    if (method === 'GET') return staff;
    if (method === 'POST') {
      const body = options.body || {};
      const newS = { _id: 's_' + Date.now(), name: body.name || 'New Staff', loginId: body.loginId || 'staff.user', role: 'staff', isActive: true, permissions: body.permissions || { canUpload: true, canEdit: true, canDelete: false, canUpdateStock: true } };
      staff.unshift(newS); setLocal('sp_demo_staff', staff);
      return newS;
    }
  }
  
  if (path.startsWith('/auth/staff/')) {
    const id = path.split('/')[3];
    const staff = getLocal('sp_demo_staff', DEFAULT_MOCK_STAFF);
    const idx = staff.findIndex(s => s._id === id);
    if (idx !== -1) {
      if (method === 'DELETE') { staff.splice(idx, 1); setLocal('sp_demo_staff', staff); return { message: 'Staff removed' }; }
      if (method === 'PUT') {
        const body = options.body || {};
        if (body.isActive !== undefined) staff[idx].isActive = body.isActive;
        if (body.name) staff[idx].name = body.name;
        if (body.permissions) staff[idx].permissions = { ...staff[idx].permissions, ...body.permissions };
        setLocal('sp_demo_staff', staff); return staff[idx];
      }
    }
  }

  // ─── NEW CMS DEMO API ───────────────────────────────────────────────────
  if (path === '/cms/admin/banners') {
    const banners = getLocal('sp_demo_banners', DEFAULT_MOCK_BANNERS);
    if (method === 'GET') return banners;
    if (method === 'POST') {
      const body = options.body instanceof FormData ? Object.fromEntries(options.body.entries()) : (options.body || {});
      const newB = {
        id: 'b_' + Date.now(),
        type: body.type || 'hero',
        title: body.title || '',
        subtitle: body.subtitle || '',
        badge_text: body.badge_text || '',
        cta_text: body.cta_text || 'Shop Now',
        cta_url: body.cta_url || '#',
        image_url: body.image_url || 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600',
        visible: body.visible !== 'false' && body.visible !== false,
        sort_order: banners.length,
        festival_tag: body.festival_tag || ''
      };
      banners.push(newB); setLocal('sp_demo_banners', banners); return newB;
    }
  }

  if (path.startsWith('/cms/admin/banners/')) {
    const id = path.split('/')[4];
    const banners = getLocal('sp_demo_banners', DEFAULT_MOCK_BANNERS);
    const idx = banners.findIndex(b => b.id === id);
    if (idx !== -1) {
      if (method === 'DELETE') { banners.splice(idx, 1); setLocal('sp_demo_banners', banners); return { message: 'Deleted' }; }
      if (method === 'PUT') {
        const body = options.body instanceof FormData ? Object.fromEntries(options.body.entries()) : (options.body || {});
        banners[idx] = { ...banners[idx], ...body };
        if (body.visible !== undefined) banners[idx].visible = body.visible === 'true' || body.visible === true;
        setLocal('sp_demo_banners', banners); return banners[idx];
      }
    }
  }

  if (path === '/cms/sections') {
    return getLocal('sp_demo_sections', DEFAULT_MOCK_SECTIONS);
  }

  if (path.startsWith('/cms/admin/sections/')) {
    const key = path.split('/')[4];
    const secs = getLocal('sp_demo_sections', DEFAULT_MOCK_SECTIONS);
    const idx = secs.findIndex(s => s.key === key);
    if (idx !== -1 && method === 'PUT') {
      const body = options.body || {};
      if (body.visible !== undefined) secs[idx].visible = body.visible;
      if (body.config !== undefined) secs[idx].config = { ...secs[idx].config, ...body.config };
      setLocal('sp_demo_sections', secs); return secs[idx];
    }
  }

  if (path === '/cms/admin/popups') {
    const popups = getLocal('sp_demo_popups', DEFAULT_MOCK_POPUPS);
    if (method === 'GET') return popups;
    if (method === 'POST') {
      const body = options.body || {};

      popups.push(newPop); setLocal('sp_demo_popups', popups); return newPop;
    }
  }

  if (path.startsWith('/cms/admin/popups/')) {
    const id = path.split('/')[4];
    const popups = getLocal('sp_demo_popups', DEFAULT_MOCK_POPUPS);
    const idx = popups.findIndex(p => p.id === id);
    if (idx !== -1) {
      if (method === 'DELETE') { popups.splice(idx, 1); setLocal('sp_demo_popups', popups); return { message: 'Deleted' }; }
      if (method === 'PUT') {
        const body = options.body || {};
        popups[idx] = { ...popups[idx], ...body };
        setLocal('sp_demo_popups', popups); return popups[idx];
      }
    }
  }

  // ─── NEW SHIPPING DEMO API ──────────────────────────────────────────────
  if (path === '/shipping/admin/zones') {
    const zones = getLocal('sp_demo_zones', DEFAULT_MOCK_ZONES);
    if (method === 'GET') return zones;
    if (method === 'POST') {
      const body = options.body || {};
      const newZ = { id: 'z_' + Date.now(), name: body.name || 'New Zone', rate_per_piece: Number(body.rate_per_piece || 60), states: body.states || [], pincode_prefixes: body.pincode_prefixes || [], is_active: true };
      zones.push(newZ); setLocal('sp_demo_zones', zones); return newZ;
    }
  }

  if (path.startsWith('/shipping/admin/zones/')) {
    const id = path.split('/')[4];
    const zones = getLocal('sp_demo_zones', DEFAULT_MOCK_ZONES);
    const idx = zones.findIndex(z => z.id === id);
    if (idx !== -1) {
      if (method === 'DELETE') { zones.splice(idx, 1); setLocal('sp_demo_zones', zones); return { message: 'Deleted' }; }
      if (method === 'PUT') {
        const body = options.body || {};
        zones[idx] = { ...zones[idx], ...body };
        if (body.rate_per_piece !== undefined) zones[idx].rate_per_piece = Number(body.rate_per_piece);
        setLocal('sp_demo_zones', zones); return zones[idx];
      }
    }
  }

  // ─── NEW ORDERS DEMO API ────────────────────────────────────────────────
  if (path === '/orders/admin/all') {
    return getLocal('sp_demo_orders', DEFAULT_MOCK_ORDERS);
  }

  if (path.startsWith('/orders/admin/')) {
    const parts = path.split('/');
    const id = parts[3];
    const sub = parts[4];
    const orders = getLocal('sp_demo_orders', DEFAULT_MOCK_ORDERS);
    const idx = orders.findIndex(o => o.id === id);
    if (idx !== -1) {
      if (sub === 'status' && method === 'PATCH') {
        const body = options.body || {};
        orders[idx] = { ...orders[idx], ...body };
        setLocal('sp_demo_orders', orders); return orders[idx];
      }
    }
  }

  return {};
}

// ─── API FETCH UTILITY ─────────────────────────────────────────────────────
async function api(path, options = {}) {
  const headers = options.headers || {};
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  if (!(options.body instanceof FormData) && options.body) { headers['Content-Type'] = 'application/json'; options.body = JSON.stringify(options.body); }
  
  if (!state.isDemo) {
    try {
      const res = await fetch(API_BASE + path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (res.ok) return data;
      if (path === '/auth/login') {
        state.isDemo = true; persist(); return handleMockApi(path, options);
      }
      throw new Error(data.message || 'Something went wrong');
    } catch (err) {
      if (path === '/auth/login' || err.message.includes('fetch') || err.message.includes('Network') || state.isDemo) {
        state.isDemo = true; persist(); return handleMockApi(path, options);
      }
      throw err;
    }
  } else {
    return handleMockApi(path, options);
  }
}

function renderFilteredStaffProductsTable() {
  const tbody = document.getElementById('staffProdTableBody');
  if (!tbody) return;
  
  const q = window.staffSearchQuery || '';
  const cat = window.staffCategoryFilter || 'all';
  const stock = window.staffStockFilter || 'all';
  
  let filtered = [...state.products];
  
  if (q) {
    filtered = filtered.filter(p => p.title.toLowerCase().includes(q) || p._id.includes(q));
  }
  if (cat !== 'all') {
    filtered = filtered.filter(p => p.category === cat);
  }
  if (stock !== 'all') {
    if (stock === 'instock') filtered = filtered.filter(p => p.stock > 0);
    else if (stock === 'lowstock') filtered = filtered.filter(p => p.stock > 0 && p.stock <= 5);
    else if (stock === 'outofstock') filtered = filtered.filter(p => p.stock === 0);
  }
  
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="sp-empty" style="text-align:center">No products match the selected filters.</td></tr>`;
    return;
  }
  
  const canEdit = state.user.permissions?.canEdit !== false;
  const canUpdateStock = state.user.permissions?.canUpdateStock !== false;
  const canDelete = state.user.permissions?.canDelete === true;
  
  tbody.innerHTML = filtered.map(p => {
    const isLow = p.stock > 0 && p.stock <= 5;
    const isOut = p.stock === 0;
    const stockPillStyle = isOut ? 'color:#b3261e;background:#fbe4e2;font-weight:700;' : (isLow ? 'color:#a07840;background:#fdf1dd;font-weight:700;' : 'color:#1e7a34;background:#e4f3e6;');
    const stockStatusLabel = isOut ? 'Out of Stock' : (isLow ? `Low Stock (${p.stock})` : `In Stock (${p.stock})`);
    
    return `
      <tr>
        <td>
          <img src="${p.images && p.images[0] ? p.images[0] : 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100'}" class="table-thumb" onerror="this.src='https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100'"/>

        <td>

        </td>
        <td>
          <span style="font-family:monospace; font-size:0.75rem; background:#faf8f6; padding:2px 6px; border-radius:4px; border:1px solid var(--border)">${p._id.slice(-6).toUpperCase()}</span>
        </td>
        <td>
          <div class="table-quick-edit">
            <input type="number" class="sp-qe-input tblPriceInput" data-id="${p._id}" value="${p.price}" min="0" ${!canEdit ? 'disabled' : ''} style="padding:4px 6px; width:75px"/>
          </div>
        </td>
        <td>
          <div class="table-quick-edit">
            <input type="number" class="sp-qe-input tblStockInput" data-id="${p._id}" value="${p.stock}" min="0" ${!canUpdateStock ? 'disabled' : ''} style="padding:4px 6px; width:65px"/>
            ${canUpdateStock ? `<button class="sp-mini-btn tblSaveBtn" data-id="${p._id}" style="min-height:30px; padding:4px 10px">Save</button>` : ''}
          </div>
          <div style="margin-top:6px"><span class="sp-chip" style="${stockPillStyle}">${stockStatusLabel}</span></div>
        </td>
        <td>
          ${statusPill(p.status)}
        </td>
        <td style="text-align: right">
          <div style="display:flex; justify-content:flex-end; gap:6px">
            <button class="sp-mini-btn tblEditBtn" data-id="${p._id}" ${!canEdit ? 'disabled' : ''}>Full Edit</button>

/* simple client-side crop tool: drag box + resize handle */
function handleImageSelect(files) {
  const cropArea = document.getElementById('cropArea');
  cropArea.innerHTML = ''; cropImages = [];
  [...files].forEach((file, idx) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const wrap = document.createElement('div');
        wrap.className = 'sp-crop-wrap';
        wrap.style.width = '260px'; wrap.style.height = (260 * img.height / img.width) + 'px';
        wrap.innerHTML = `<img src="${e.target.result}" class="sp-crop-img"/>
          <div class="sp-crop-box" style="left:10%;top:10%;width:80%;height:80%;"><div class="sp-crop-handle"></div></div>`;
        cropArea.appendChild(wrap);
        const record = { file, naturalW: img.width, naturalH: img.height, cropBox: null };
        cropImages[idx] = record;
        setupCropDrag(wrap, wrap.querySelector('.sp-crop-box'), record);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function setupCropDrag(container, box, record) {
  let dragging = null, start = {};
  function updateBox() {
    const cRect = container.getBoundingClientRect(), bRect = box.getBoundingClientRect();
    const scaleX = record.naturalW / cRect.width, scaleY = record.naturalH / cRect.height;
    record.cropBox = { left: (bRect.left - cRect.left) * scaleX, top: (bRect.top - cRect.top) * scaleY, width: bRect.width * scaleX, height: bRect.height * scaleY };
  }
  box.addEventListener('pointerdown', (e) => {
    dragging = e.target.classList.contains('sp-crop-handle') ? 'resize' : 'move';
    start = { x: e.clientX, y: e.clientY, left: box.offsetLeft, top: box.offsetTop, w: box.offsetWidth, h: box.offsetHeight };
    e.preventDefault();
  });
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (dragging === 'move') {
      box.style.left = Math.max(0, Math.min(container.clientWidth - box.offsetWidth, start.left + dx)) + 'px';
      box.style.top = Math.max(0, Math.min(container.clientHeight - box.offsetHeight, start.top + dy)) + 'px';
    } else {
      box.style.width = Math.max(30, Math.min(container.clientWidth - box.offsetLeft, start.w + dx)) + 'px';
      box.style.height = Math.max(30, Math.min(container.clientHeight - box.offsetTop, start.h + dy)) + 'px';
    }
    updateBox();
  });
  window.addEventListener('pointerup', () => { if (dragging) updateBox(); dragging = null; });
  updateBox();
}

      });
      document.getElementById('addHeroBtn').onclick = () => openBannerModal(null, 'hero');
      document.getElementById('addFestBtn').onclick = () => openBannerModal(null, 'festival');

        const ban = state.banners.find(x => x.id === b.dataset.id);

      });
      content.querySelectorAll('.delBannerBtn').forEach(b => b.onclick = async () => {
        if (confirm('Delete this banner?')) {
          await api('/cms/admin/banners/' + b.dataset.id, { method: 'DELETE' });
          await syncOfflineCmsData();
          showAdminTab('cms');
        }
      });
      document.getElementById('addPopupBtn').onclick = () => openPopupModal(null);
      content.querySelectorAll('.editPopupBtn').forEach(b => b.onclick = () => {
        openPopupModal(state.popups.find(x => x.id === b.dataset.id));
      });
      content.querySelectorAll('.delPopupBtn').forEach(b => b.onclick = async () => {
        if (confirm('Delete this popup?')) {
          await api('/cms/admin/popups/' + b.dataset.id, { method: 'DELETE' });
          showAdminTab('cms');
        }
      });

    } else if (tab === 'shipping') {
      state.zones = await api('/shipping/admin/zones');
      content.innerHTML = `
        <button id="addZoneBtn" class="btn-pill sp-btn-block" style="margin-bottom:16px">+ Add New Shipping Zone</button>

          ${state.zones.length === 0 ? `<p class="sp-empty">No shipping zones defined yet.</p>` : state.zones.map(z => `
            <div class="sp-card sp-card--stack">
              <div class="sp-header-row" style="margin-bottom:8px">
                <div class="sp-card__title" style="margin:0">${esc(z.name)}</div>

            </div>`).join('')}
        </div>
      `;
      document.getElementById('addZoneBtn').onclick = () => openZoneModal(null);
      content.querySelectorAll('.editZoneBtn').forEach(b => b.onclick = () => openZoneModal(state.zones.find(x => x.id === b.dataset.id)));
      content.querySelectorAll('.delZoneBtn').forEach(b => b.onclick = async () => {
        if (confirm('Delete this shipping zone?')) {
          await api('/shipping/admin/zones/' + b.dataset.id, { method: 'DELETE' });
          showAdminTab('shipping');
        }
      });

    } else if (tab === 'orders') {
      state.orders = await api('/orders/admin/all');
      content.innerHTML = `
        <div class="sp-list">
          ${state.orders.length === 0 ? `<p class="sp-empty">No orders placed yet.</p>` : state.orders.map(o => `
            <div class="sp-card sp-card--stack">
              <div class="sp-header-row" style="margin-bottom:8px">
                <div>
                  <div class="sp-card__title" style="margin:0">${esc(o.order_number)}</div>
                  <div class="sp-sub">${new Date(o.created_at).toLocaleDateString('en-IN')}</div>
                </div>
                <div>
                  <span class="sp-pill sp-pill--${o.order_status === 'delivered' ? 'approved' : o.order_status === 'cancelled' ? 'rejected' : 'pending'}">${o.order_status}</span>
                </div>
              </div>
              <div style="font-size:0.82rem; margin-bottom:10px">
                <strong>Customer:</strong> ${esc(o.customer_name)} (${esc(o.customer_phone)})<br/>
                <strong>Address:</strong> ${esc(o.delivery_address.line1 || '')}, ${esc(o.delivery_address.city || '')}, ${esc(o.delivery_address.state || '')} - ${esc(o.pincode)} <br/>
                <strong>Total Amount:</strong> ₹${o.total} (${o.payment_type === 'cod' ? 'COD (20% advance)' : 'Prepaid'}) <br/>
                <strong>Payment Status:</strong> ${statusPill(o.payment_status)}
              </div>
              <div style="background:#faf8f6; border-radius:8px; padding:8px; margin-bottom:12px">
                <div style="font-weight:700; font-size:0.75rem; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.05em">Items</div>
                ${o.items.map(item => `
                  <div class="sp-order-item" style="display:flex; gap:12px; align-items:center;">
                    <img src="${item.image || 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100'}" style="width:40px; height:50px; object-fit:cover; border-radius:4px; border:1px solid var(--border)" onerror="this.src='https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100'"/>
                    <div>
                      <div style="font-weight:600; color:var(--black)">${esc(item.title)}</div>
                      <div style="font-size:0.75rem; color:var(--warm-grey)">Size: ${esc(item.size || 'M')} | Col: ${esc(item.colour || '—')} | Qty: ${item.qty}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="sp-quick-edit" style="margin-bottom:12px">
                <div class="sp-qe-field" style="max-width:120px">
                  <label class="sp-qe-label">Shipping Override</label>
                  <input type="number" class="sp-qe-input orderShipOverride" data-id="${o.id}" value="${o.shipping_charge}" min="0"/>
                </div>
                <button class="sp-qe-save saveShipBtn" data-id="${o.id}">Override</button>
              </div>
              <div class="sp-staff-actions">
                <button class="sp-mini-btn editOrderBtn" data-id="${o.id}">Update Status & Tracking</button>
                <button class="sp-mini-btn printLabelBtn" data-id="${o.id}" style="background:#f4efeb;color:var(--black);border-color:var(--border)">Download Courier Label</button>
              </div>
            </div>`).join('')}
        </div>
      `;
      content.querySelectorAll('.saveShipBtn').forEach(b => b.onclick = async () => {
        const inp = b.closest('.sp-quick-edit').querySelector('.orderShipOverride');
        await api('/orders/admin/' + b.dataset.id + '/status', { method: 'PATCH', body: { shipping_charge: Number(inp.value) } });
        alert('Shipping charge overridden successfully!');
        showAdminTab('orders');
      });
      content.querySelectorAll('.editOrderBtn').forEach(b => b.onclick = () => openOrderModal(state.orders.find(x => x.id === b.dataset.id)));
      content.querySelectorAll('.printLabelBtn').forEach(b => b.onclick = () => downloadCourierLabel(b.dataset.id));
    }
  } catch(err) {
    content.innerHTML = `<div class="sp-form-msg sp-form-msg--error" style="margin-top:40px">${err.message || 'Error loading data. Check console.'}</div>`;
    console.error('Tab Load Error:', err);
  }
}

function openBannerModal(banner, type) {
  const modal = document.getElementById('formModal');
  const content = document.getElementById('formModalContent');
  modal.style.display = 'flex';
  const isEdit = !!banner;

  content.innerHTML = `
    <div class="sp-modal__head">
      <h2 class="sp-modal__title">${isEdit ? 'Edit' : 'Add'} ${type === 'hero' ? 'Hero' : 'Festival'} Banner</h2>
      <button id="closeForm" class="sp-close">&times;</button>
    </div>
    <div id="formMsg" class="sp-form-msg" style="margin-bottom:8px"></div>

    <label class="sp-field-label">Banner Title *</label>
    <input id="b_title" placeholder="e.g. Rakhi Special Sale" class="sp-input" value="${banner ? esc(banner.title) : ''}"/>

    <label class="sp-field-label">Subtitle / Tagline</label>
    <input id="b_sub" placeholder="e.g. Flat 10% Off on everything" class="sp-input" value="${banner ? esc(banner.subtitle) : ''}"/>

    <label class="sp-field-label">Badge Text</label>
    <input id="b_badge" placeholder="e.g. Festival Special" class="sp-input" value="${banner ? esc(banner.badge_text) : ''}"/>

    <div class="sp-form-grid">
      <div class="sp-form-group">
        <label class="sp-field-label">Button CTA Text</label>
        <input id="b_cta_text" placeholder="Shop Now" class="sp-input" value="${banner ? esc(banner.cta_text) : 'Shop Now'}"/>
      </div>
      <div class="sp-form-group">
        <label class="sp-field-label">Button Link URL</label>
        <input id="b_cta_url" placeholder="#" class="sp-input" value="${banner ? esc(banner.cta_url) : '#'}"/>
      </div>
    </div>

    ${type === 'festival' ? `
      <label class="sp-field-label">Festival Tag (Rakhi, Diwali, Eid etc.)</label>
      <input id="b_fest_tag" placeholder="e.g. Diwali" class="sp-input" value="${banner ? esc(banner.festival_tag) : ''}"/>
    ` : ''}

    <label class="sp-field-label">Banner Photo URL *</label>
    <input id="b_image_url" placeholder="https://images.unsplash.com/..." class="sp-input" value="${banner ? esc(banner.image_url) : ''}"/>

    <label class="sp-toggle-row">
      <span class="sp-field-label" style="margin:0">Visible / Active</span>
      <div class="sp-switch">
        <input type="checkbox" id="b_visible" ${(!banner || banner.visible !== false) ? 'checked' : ''}/>
        <span class="sp-switch__track"></span>
      </div>
    </label>

    <button id="saveBannerBtn" class="btn-pill sp-btn-block sp-save-btn">Save Banner</button>
  `;

  document.getElementById('closeForm').onclick = closeForm;
  document.getElementById('saveBannerBtn').onclick = async () => {
    const title = document.getElementById('b_title').value.trim();
    const image_url = document.getElementById('b_image_url').value.trim();
    if (!title || !image_url) {
      const msg = document.getElementById('formMsg');
      msg.textContent = 'Title and Image URL are required.';
      msg.className = 'sp-form-msg sp-form-msg--error';
      return;
    }

    const body = {
      type, title, subtitle: document.getElementById('b_sub').value,
      badge_text: document.getElementById('b_badge').value,
      cta_text: document.getElementById('b_cta_text').value,
      cta_url: document.getElementById('b_cta_url').value,
      image_url, visible: document.getElementById('b_visible').checked,
      festival_tag: type === 'festival' ? document.getElementById('b_fest_tag').value : ''
    };

    if (isEdit) {
      await api('/cms/admin/banners/' + banner.id, { method: 'PUT', body });
    } else {
      await api('/cms/admin/banners', { method: 'POST', body });
    }
    closeForm();
    showAdminTab('cms');
  };
}

function openZoneModal(zone) {
  const modal = document.getElementById('formModal');
  const content = document.getElementById('formModalContent');
  modal.style.display = 'flex';
  const isEdit = !!zone;

  content.innerHTML = `
    <div class="sp-modal__head">
      <h2 class="sp-modal__title">${isEdit ? 'Edit' : 'Add'} Shipping Zone</h2>
      <button id="closeForm" class="sp-close">&times;</button>
    </div>

    <label class="sp-field-label">Zone Name *</label>
    <input id="z_name" placeholder="e.g. North India" class="sp-input" value="${zone ? esc(zone.name) : ''}"/>

    <label class="sp-field-label">Rate Per Garment Piece (₹) *</label>
    <input id="z_rate" type="number" class="sp-input" value="${zone ? zone.rate_per_piece : '60'}"/>

    <label class="sp-field-label">Covered States (comma-separated)</label>
    <textarea id="z_states" placeholder="Punjab, Delhi, Haryana..." class="sp-input sp-textarea" rows="3">${zone ? zone.states.join(', ') : ''}</textarea>

    <label class="sp-field-label">PIN Code Prefixes (comma-separated, match start of pincode)</label>
    <input id="z_prefixes" placeholder="11, 12, 13" class="sp-input" value="${zone ? zone.pincode_prefixes.join(', ') : ''}"/>

    <button id="saveZoneBtn" class="btn-pill sp-btn-block sp-save-btn">Save Shipping Zone</button>
  `;

  document.getElementById('closeForm').onclick = closeForm;
  document.getElementById('saveZoneBtn').onclick = async () => {
    const name = document.getElementById('z_name').value.trim();
    const rate_per_piece = Number(document.getElementById('z_rate').value);
    if (!name) return alert('Zone Name is required.');

    const states = document.getElementById('z_states').value.split(',').map(s => s.trim()).filter(Boolean);
    const pincode_prefixes = document.getElementById('z_prefixes').value.split(',').map(s => s.trim()).filter(Boolean);

    const body = { name, rate_per_piece, states, pincode_prefixes };

    if (isEdit) {
      await api('/shipping/admin/zones/' + zone.id, { method: 'PUT', body });
    } else {
      await api('/shipping/admin/zones', { method: 'POST', body });
    }
    closeForm();
    showAdminTab('shipping');
  };
}

      <option value="shipped" ${order.order_status === 'shipped' ? 'selected' : ''}>Shipped</option>
      <option value="out_for_delivery" ${order.order_status === 'out_for_delivery' ? 'selected' : ''}>Out for Delivery</option>
      <option value="delivered" ${order.order_status === 'delivered' ? 'selected' : ''}>Delivered</option>
      <option value="cancelled" ${order.order_status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
    </select>

    <div class="sp-section-label">Courier Tracking (for Shipped status)</div>
    <label class="sp-field-label">Courier Partner</label>
    <input id="o_courier" placeholder="e.g. Delhivery / DTDC" class="sp-input" value="${order.tracking_courier || ''}"/>

    <label class="sp-field-label">Tracking Number</label>
    <input id="o_track_num" placeholder="e.g. 1293847239" class="sp-input" value="${order.tracking_number || ''}"/>

    <label class="sp-field-label">Tracking URL</label>
    <input id="o_track_url" placeholder="https://..." class="sp-input" value="${order.tracking_url || ''}"/>

    <button id="saveOrderBtn" class="btn-pill sp-btn-block sp-save-btn">Update Order</button>
  `;

  document.getElementById('closeForm').onclick = closeForm;
  document.getElementById('saveOrderBtn').onclick = async () => {
    const body = {
      order_status: document.getElementById('o_status').value,
      tracking_courier: document.getElementById('o_courier').value.trim(),
      tracking_number: document.getElementById('o_track_num').value.trim(),
      tracking_url: document.getElementById('o_track_url').value.trim()
    };
    await api('/orders/admin/' + order.id + '/status', { method: 'PATCH', body });
    closeForm();
    showAdminTab('orders');
  };
}

/* ---- Auto-generate helpers ---- */
function genId(name) {
  const clean = (name || 'staff').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);
  return 'staff.' + clean + Math.floor(10 + Math.random() * 90);
}
function genPassword() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#!';
  return Array.from({length: 10}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
}

/* ---- Staff Modal (Create / Edit) ---- */
function openStaffModal(staff) {
  const PERM_DEFS = [
    { key: 'canUpload',      icon: '↑', label: 'Upload Products' },
    { key: 'canEdit',        icon: '✎', label: 'Edit Products' },
    { key: 'canDelete',      icon: '✕', label: 'Delete Products' },
    { key: 'canUpdateStock', icon: '⊡', label: 'Update Stock' }
  ];
  const isEdit = !!staff;
  const modal = document.getElementById('formModal');
  const content = document.getElementById('formModalContent');
  modal.style.display = 'flex';
  content.innerHTML = `
    <div class="sp-modal__head">
      <h2 class="sp-modal__title">${isEdit ? 'Edit Staff Member' : 'Create Staff Member'}</h2>
      <button id="closeStaffForm" class="sp-close">&times;</button>
    </div>
    <div id="staffFormMsg" class="sp-form-msg" style="margin-bottom:10px"></div>

    <label class="sp-field-label">Full Name</label>
    <input id="sf_name" placeholder="e.g. Rahul Sharma" class="sp-input" value="${staff ? esc(staff.name) : ''}"/>

    <label class="sp-field-label">Login ID</label>
    <div class="sp-input-row">
      <input id="sf_loginId" placeholder="e.g. staff.rahul42" class="sp-input sp-input--flex" value="${staff ? esc(staff.loginId) : ''}"/>
      <button type="button" id="genIdBtn" class="sp-gen-btn" title="Auto-generate ID">⟳ Generate ID</button>
    </div>

    ${!isEdit ? `
    <label class="sp-field-label">Password</label>
    <div class="sp-input-row">
      <input id="sf_password" type="password" placeholder="Create a password" class="sp-input sp-input--flex"/>
      <button type="button" id="genPwBtn" class="sp-gen-btn" title="Auto-generate password">⟳ Generate</button>
      <button type="button" id="togglePwBtn" class="sp-gen-btn sp-gen-btn--icon" title="Show/hide">👁</button>
    </div>
    <div id="pwStrength" class="sp-pw-strength"></div>
    ` : ''}

    <label class="sp-field-label" style="margin-top:16px">Permissions</label>
    <div class="sp-perm-grid">
      ${PERM_DEFS.map(p => `
        <label class="sp-perm-card ${(staff && staff.permissions[p.key]) || (!staff && (p.key==='canUpload'||p.key==='canEdit'||p.key==='canUpdateStock')) ? 'sp-perm-card--on' : ''}">
          <input type="checkbox" id="sf_${p.key}" class="sp-perm-cb" ${(staff && staff.permissions[p.key]) || (!staff && (p.key==='canUpload'||p.key==='canEdit'||p.key==='canUpdateStock')) ? 'checked' : ''}/>
          <span class="sp-perm-card__icon">${p.icon}</span>
          <span class="sp-perm-card__label">${p.label}</span>
        </label>`).join('')}
    </div>

    <button id="saveStaffBtn" class="btn-pill sp-btn-block" style="margin-top:20px">${isEdit ? 'Save Changes' : 'Create Staff Member'}</button>
  `;
  document.getElementById('closeStaffForm').onclick = closeForm;

  content.querySelectorAll('.sp-perm-cb').forEach(cb => {
    cb.onchange = () => {
      const card = cb.closest('.sp-perm-card');
      if(cb.checked) card.classList.add('sp-perm-card--on');
      else card.classList.remove('sp-perm-card--on');
    };
  });

  if(document.getElementById('genIdBtn')) {
    document.getElementById('genIdBtn').onclick = () => {
      document.getElementById('sf_loginId').value = genId(document.getElementById('sf_name').value);
    };
  }
  if(document.getElementById('genPwBtn')) {
    document.getElementById('genPwBtn').onclick = () => {
      const pw = genPassword();
      const field = document.getElementById('sf_password');
      field.type = 'text'; field.value = pw; updatePwStrength(pw);
    };
    document.getElementById('togglePwBtn').onclick = () => {
      const f = document.getElementById('sf_password');
      f.type = f.type === 'password' ? 'text' : 'password';
    };
    document.getElementById('sf_password').oninput = e => updatePwStrength(e.target.value);
  }

  if(!isEdit && document.getElementById('sf_name')) {
    document.getElementById('sf_name').oninput = () => {
      const idField = document.getElementById('sf_loginId');
      if(!idField.value || idField.dataset.touched !== 'y') {
        idField.value = genId(document.getElementById('sf_name').value);
      }
    };
    document.getElementById('sf_loginId').oninput = e => { e.target.dataset.touched = 'y'; };
  }

  document.getElementById('saveStaffBtn').onclick = async () => {
    const msg = document.getElementById('staffFormMsg');
    const name = document.getElementById('sf_name').value.trim();
    const loginId = document.getElementById('sf_loginId').value.trim();
    const permissions = {
      canUpload: document.getElementById('sf_canUpload').checked,
      canEdit: document.getElementById('sf_canEdit').checked,
      canDelete: document.getElementById('sf_canDelete').checked,
      canUpdateStock: document.getElementById('sf_canUpdateStock').checked,
    };

    if(!name) { msg.textContent = 'Please enter the staff member\'s name.'; msg.className = 'sp-form-msg sp-form-msg--error'; return; }
    if(!loginId) { msg.textContent = 'Please enter or generate a Login ID.'; msg.className = 'sp-form-msg sp-form-msg--error'; return; }

    try {
      msg.textContent = 'Saving...'; msg.className = 'sp-form-msg sp-form-msg--pending';
      if(isEdit) {
        await api('/auth/staff/' + staff._id, { method: 'PUT', body: { name, loginId, permissions } });
        msg.textContent = '✓ Staff member updated!'; msg.className = 'sp-form-msg sp-form-msg--ok';
      } else {
        const password = document.getElementById('sf_password').value;
        if(!password) { msg.textContent = 'Please enter or generate a password.'; msg.className = 'sp-form-msg sp-form-msg--error'; return; }
        await api('/auth/staff', { method: 'POST', body: { name, loginId, password, permissions } });
        msg.textContent = `✓ Staff member created! Login: ${loginId}`;
        msg.className = 'sp-form-msg sp-form-msg--ok';
      }
      setTimeout(() => { closeForm(); showAdminTab('staff'); }, 1200);
    } catch(err) {
      msg.textContent = err.message; msg.className = 'sp-form-msg sp-form-msg--error';
    }
  };
}

/* ---- Reset Password Modal ---- */
function openResetPasswordModal(staffId) {
  const modal = document.getElementById('formModal');
  const content = document.getElementById('formModalContent');
  modal.style.display = 'flex';
  content.innerHTML = `
    <div class="sp-modal__head">
      <h2 class="sp-modal__title">Reset Password</h2>
      <button id="closeResetForm" class="sp-close">&times;</button>
    </div>
    <p class="sp-sub" style="margin-bottom:16px">Enter a new password for this staff member, or auto-generate one.</p>
    <div id="resetMsg" class="sp-form-msg" style="margin-bottom:10px"></div>
    <label class="sp-field-label">New Password</label>
    <div class="sp-input-row">
      <input id="rp_password" type="password" placeholder="New password" class="sp-input sp-input--flex"/>
      <button type="button" id="rp_genBtn" class="sp-gen-btn">⟳ Generate</button>
      <button type="button" id="rp_toggleBtn" class="sp-gen-btn sp-gen-btn--icon">👁</button>
    </div>
    <div id="rp_strength" class="sp-pw-strength"></div>
    <button id="rp_saveBtn" class="btn-pill sp-btn-block" style="margin-top:20px">Save New Password</button>
  `;
  document.getElementById('closeResetForm').onclick = closeForm;
  document.getElementById('rp_genBtn').onclick = () => {
    const pw = genPassword();
    const field = document.getElementById('rp_password');
    field.type = 'text'; field.value = pw; updatePwStrengthEl('rp_strength', pw);
  };
  document.getElementById('rp_toggleBtn').onclick = () => {
    const f = document.getElementById('rp_password');
    f.type = f.type === 'password' ? 'text' : 'password';
  };
  document.getElementById('rp_password').oninput = e => updatePwStrengthEl('rp_strength', e.target.value);
  document.getElementById('rp_saveBtn').onclick = async () => {
    const msg = document.getElementById('resetMsg');
    const pw = document.getElementById('rp_password').value;
    if(!pw) { msg.textContent = 'Please enter or generate a password.'; msg.className = 'sp-form-msg sp-form-msg--error'; return; }
    try {
      msg.textContent = 'Saving...'; msg.className = 'sp-form-msg sp-form-msg--pending';
      await api('/auth/staff/' + staffId, { method: 'PUT', body: { password: pw } });
      msg.textContent = '✓ Password reset successfully!'; msg.className = 'sp-form-msg sp-form-msg--ok';
      setTimeout(() => closeForm(), 1200);
    } catch(err) { msg.textContent = err.message; msg.className = 'sp-form-msg sp-form-msg--error'; }
  };
}

function updatePwStrength(pw) { updatePwStrengthEl('pwStrength', pw); }
function updatePwStrengthEl(elId, pw) {
  const el = document.getElementById(elId); if(!el) return;
  if(!pw) { el.innerHTML = ''; return; }
  const score = [pw.length >= 8, /[A-Z]/.test(pw), /[0-9]/.test(pw), /[^A-Za-z0-9]/.test(pw)].filter(Boolean).length;
  const labels = ['','Weak','Fair','Good','Strong'];
  const colors = ['','#b3261e','#e08000','#2d7a4e','#1a5c38'];
  el.innerHTML = `<div class="sp-pw-bar"><div class="sp-pw-fill" style="width:${score*25}%;background:${colors[score]}"></div></div><span style="font-size:0.7rem;color:${colors[score]}">${labels[score]}</span>`;
}

function renderFilteredProductsTable() {
  const tbody = document.getElementById('prodTableBody');
  if (!tbody) return;
  
  const q = window.prodSearchQuery || '';
  const cat = window.prodCategoryFilter || 'all';
  const stock = window.prodStockFilter || 'all';
  
  let filtered = [...state.products];
  
  if (q) {
    filtered = filtered.filter(p => p.title.toLowerCase().includes(q) || p._id.includes(q));
  }
  if (cat !== 'all') {
    filtered = filtered.filter(p => p.category === cat);
  }
  if (stock !== 'all') {
    if (stock === 'instock') filtered = filtered.filter(p => p.stock > 0);
    else if (stock === 'lowstock') filtered = filtered.filter(p => p.stock > 0 && p.stock <= 5);
    else if (stock === 'outofstock') filtered = filtered.filter(p => p.stock === 0);
  }
  
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="sp-empty" style="text-align:center">No products match the selected filters.</td></tr>`;
    return;
  }
  
  tbody.innerHTML = filtered.map(p => {
    const isLow = p.stock > 0 && p.stock <= 5;
    const isOut = p.stock === 0;
    const stockPillStyle = isOut ? 'color:#b3261e;background:#fbe4e2;font-weight:700;' : (isLow ? 'color:#a07840;background:#fdf1dd;font-weight:700;' : 'color:#1e7a34;background:#e4f3e6;');
    const stockStatusLabel = isOut ? 'Out of Stock' : (isLow ? `Low Stock (${p.stock})` : `In Stock (${p.stock})`);
    
    return `
      <tr>
        <td>
          <img src="${p.images && p.images[0] ? p.images[0] : 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100'}" class="table-thumb" onerror="this.src='https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100'"/>
        </td>
        <td>
          <div style="font-weight:700; color:var(--black); font-size:0.9rem">${esc(p.title)}</div>
          <div style="font-size:0.75rem; color:var(--warm-grey)">Category: <span class="sp-chip">${esc(p.category)}</span> | Colour: ${esc(p.colour || '—')}</div>
        </td>
        <td>
          <span style="font-family:monospace; font-size:0.75rem; background:#faf8f6; padding:2px 6px; border-radius:4px; border:1px solid var(--border)">${p._id.slice(-6).toUpperCase()}</span>
        </td>
        <td>
          <div class="table-quick-edit">
            <input type="number" class="sp-qe-input tblPriceInput" data-id="${p._id}" value="${p.price}" min="0" style="padding:4px 6px; width:75px"/>
          </div>
        </td>
        <td>
          <div class="table-quick-edit">
            <input type="number" class="sp-qe-input tblStockInput" data-id="${p._id}" value="${p.stock}" min="0" style="padding:4px 6px; width:65px"/>
            <button class="sp-mini-btn tblSaveBtn" data-id="${p._id}" style="min-height:30px; padding:4px 10px">Save</button>
          </div>
          <div style="margin-top:6px"><span class="sp-chip" style="${stockPillStyle}">${stockStatusLabel}</span></div>
        </td>
        <td>
          ${statusPill(p.status)}
        </td>
        <td style="text-align: right">
          <div style="display:flex; justify-content:flex-end; gap:6px">
            <button class="sp-mini-btn tblEditBtn" data-id="${p._id}">Full Edit</button>
            ${p.status !== 'approved' ? `<button class="sp-mini-btn sp-mini-btn--ok tblApprBtn" data-id="${p._id}">Approve</button>` : ''}
            ${p.status !== 'rejected' ? `<button class="sp-mini-btn tblRejBtn" data-id="${p._id}">Reject</button>` : ''}
            <button class="sp-mini-btn sp-mini-btn--danger tblDelBtn" data-id="${p._id}">Delete</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
  
  // Bind actions
  tbody.querySelectorAll('.tblEditBtn').forEach(b => b.onclick = () => openProductForm(state.products.find(p => p._id === b.dataset.id)));
  tbody.querySelectorAll('.tblSaveBtn').forEach(b => b.onclick = () => quickSavePriceStockTable(b.dataset.id, b));
  tbody.querySelectorAll('.tblApprBtn').forEach(b => b.onclick = async () => { await api('/products/' + b.dataset.id + '/approve', { method: 'PATCH' }); showAdminTab('products'); });
  tbody.querySelectorAll('.tblRejBtn').forEach(b => b.onclick = async () => { const reason = prompt('Reason for rejection?') || ''; await api('/products/' + b.dataset.id + '/reject', { method: 'PATCH', body: { reason } }); showAdminTab('products'); });
  tbody.querySelectorAll('.tblDelBtn').forEach(b => b.onclick = async () => { if (confirm('Permanently delete this product?')) { await api('/products/' + b.dataset.id + '/permanent', { method: 'DELETE' }); showAdminTab('products'); } });
}

async function quickSavePriceStockTable(id, btn) {
  const row = btn.closest('tr');
  const priceEl = row.querySelector('.tblPriceInput');
  const stockEl = row.querySelector('.tblStockInput');
  const orig = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  try {
    const fd = new FormData();
    fd.append('price', priceEl.value);
    fd.append('stock', stockEl.value);
    const cur = state.products.find(p => p._id === id);
    if (cur) {
      fd.append('title', cur.title);
      fd.append('description', cur.description || '');
      fd.append('colour', cur.colour || '');
      fd.append('size', cur.size || '');
      fd.append('category', cur.category || 'other');
    }
    await api('/products/' + id, { method: 'PUT', body: fd });
    btn.textContent = '✓'; btn.style.background = '#1e7a34'; btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; showAdminTab('products'); }, 1000);
    if (cur) { cur.price = Number(priceEl.value); cur.stock = Number(stockEl.value); }
  } catch(err) {
    btn.textContent = '!'; btn.style.background = '#b3261e'; btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; }, 2000);
  }
}

async function syncOfflineCmsData() {
  const banners = await api('/cms/admin/banners');
  const sections = await api('/cms/sections');
  const popups = await api('/cms/admin/popups');
  
  // Announcement text
  const annText = sections.find(s => s.key === 'announcement')?.config?.text || '';
  
  // Active popup
  const activePop = popups.find(p => p.visible);
  
  // Section visibilities
  const secObj = {};
  sections.forEach(s => {
    secObj[s.key === 'poster_spread' ? 'poster-spread' : s.key === 'categories' ? 'cat-browser' : s.key] = s.visible !== false;
    // Embed the section config if it exists (like poster_spread)
    if (s.key === 'poster_spread') {
      secObj['poster_spread'] = { visible: s.visible !== false, config: s.config };
    }
  });
  
  // Hero and festival banners
  const heroBanners = banners.filter(b => b.type === 'hero' && b.visible);
  const festivalBanners = banners.filter(b => b.type === 'festival' && b.visible);
  
  const cmsPayload = {
    announcement: annText,
    heroBanners,
    festivalBanners,
    sections: secObj,
    popup: activePop ? {
      enabled: true,
      title: activePop.title,
      body: activePop.body,
      image_url: activePop.image_url,
      cta_label: activePop.cta_text,
      cta_url: activePop.cta_url,
      delay: activePop.trigger_delay_seconds
    } : { enabled: false }
  };
  
  localStorage.setItem('cms_data', JSON.stringify(cmsPayload));
}
