// ─── MOCK API REQUEST HANDLER ──────────────────────────────────────────────
async function handleMockApi(path, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  
  if (path === '/auth/login') {
    const body = options.body || {};
    const id = (body.loginId || '').toLowerCase().trim();
    const isAdmin = id === 'admin@tavusha.com' || id.includes('admin');
    return {
      token: 'demo_token_' + Date.now(),
      user: { _id: isAdmin ? 'admin1' : 'staff1', name: isAdmin ? 'Main Admin' : 'Staff Member', loginId: id || 'admin@tavusha.com', role: isAdmin ? 'admin' : 'staff', permissions: { canUpload: true, canEdit: true, canDelete: true, canUpdateStock: true } }
    };
  }
  
  if (path === '/products') {
    const prods = getLocal('sp_demo_products', DEFAULT_MOCK_PRODS);
    if (method === 'GET') return prods;
    if (method === 'POST') {
      let title = 'New Product', price = 0, stock = 0, colour = '', colorVariants = [], size = '', category = 'other', description = '';
      let images = [];
      if (options.body instanceof FormData) {
        title = options.body.get('title') || title;
        price = Number(options.body.get('price') || 0);
        stock = Number(options.body.get('stock') || 0);
        colour = options.body.get('colour') || '';
        const cv = options.body.get('colorVariants');
        if (cv) { try { colorVariants = JSON.parse(cv); } catch(e) { colorVariants = []; } }
        size = options.body.get('size') || '';
        category = options.body.get('category') || 'other';
        description = options.body.get('description') || '';
        const imgDataStr = options.body.get('imagesData');
        if (imgDataStr) {

// ─── API FETCH UTILITY ─────────────────────────────────────────────────────
async function api(path, options = {}) {
  const headers = options.headers || {};
  if (state.token && !state.token.startsWith('demo_token_')) {
    headers['Authorization'] = 'Bearer ' + state.token;
  }
  if (!(options.body instanceof FormData) && options.body) {
    headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(options.body);
  }
  
  // Explicit demo token check (only if explicitly in demo mode)
  if (state.token && state.token.startsWith('demo_token_') && path !== '/auth/login') {
    return handleMockApi(path, options);
  }

  // Always attempt real backend for login or when we have no token / real token
  try {
    const res = await fetch(API_BASE + path, { ...options, headers });
    const data = await res.json().catch(() => ({}));
    
    if (res.ok) {
      if (state.isDemo && path === '/auth/login') {
        state.isDemo = false;
        persist();
      }
      return data;
    }

    if (res.status === 401 || res.status === 403) {
      if (state.token && state.token.startsWith('demo_token_')) {
        return handleMockApi(path, options);
      }
      // If token expired on live backend, fallback to mock if demo login allowed
      if (path !== '/auth/login') {
        return handleMockApi(path, options);
      }
    }

    // Server returned error (e.g. 404/500), fall back to mock for demo user
    return handleMockApi(path, options);
  } catch (err) {
    // Network / fetch errors (cold start / offline): fall back to local mock
    return handleMockApi(path, options);
  }
}

// ─── REAL BACKEND API (bypasses demo/mock fallback) ─────────────────────────
// Use this for product uploads & approvals so they ALWAYS go directly to the backend database.
async function apiLive(path, options = {}) {
  const headers = options.headers || {};
  if (state.token && !state.token.startsWith('demo_token_')) {
    headers['Authorization'] = 'Bearer ' + state.token;
  }
  if (!(options.body instanceof FormData) && options.body) {
    headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(options.body);
  }
  const base = typeof RENDER_BACKEND !== 'undefined' ? RENDER_BACKEND : API_BASE;
  const res = await fetch(base + path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (res.ok) return data;
  throw new Error(data.error || data.message || `Backend returned status ${res.status}`);
}

function isAdminUser(user) {
  if (!user) return false;
  return user.role === 'admin' || ADMIN_EMAILS.includes((user.loginId || '').toLowerCase());
}

function render() {
  const app = document.getElementById('app');
  if (!state.token) { app.innerHTML = loginView(); attachLogin(); return; }
  if (isAdminUser(state.user)) { app.innerHTML = adminView(); attachAdmin(); return; }
  app.innerHTML = staffView(); attachStaff();
}

function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fixDriveUrl(url) {
  if (!url) return '';
  const m = url.match(/[?&]id=([^&]+)/) || url.match(/\/file\/d\/([^/]+)/) || url.match(/\/d\/([^/]+)/);
  return (m && m[1]) ? 'https://lh3.googleusercontent.com/d/' + m[1] + '=w800' : url;
}
function statusPill(s) { return `<span class="sp-pill sp-pill--${s}">${s}</span>`; }

function renderProductColorBadges(p) {
  if (Array.isArray(p.colorVariants) && p.colorVariants.length > 0) {
    return `<div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:4px">` + p.colorVariants.map(v => {
      const st = Number(v.stock !== undefined ? v.stock : 0);
      const isOut = st <= 0;
      const isLow = st > 0 && st <= 5;
      const stockColor = isOut ? '#b3261e' : (isLow ? '#a07840' : '#1e7a34');
      return `<span class="sp-color-chip" title="${esc(v.color)}: ${st} in stock"><span class="sp-color-dot" style="background:${v.hex || '#1C1917'}"></span><span>${esc(v.color)}</span>: <strong style="color:${stockColor}">${st}</strong></span>`;
    }).join('') + `</div>`;
  }
  return `<div style="font-size:0.75rem; color:var(--warm-grey); margin-top:3px">Colour: <span>${esc(p.colour || '—')}</span></div>`;
}

function renderFilteredStaffProductsTable() {
  const tbody = document.getElementById('staffProdTableBody');
  if (!tbody) return;
  
  const q = window.staffSearchQuery || '';
  const cat = window.staffCategoryFilter || 'all';
  const stock = window.staffStockFilter || 'all';
  
  let filtered = [...state.products];
  
  if (q) {
    filtered = filtered.filter(p => p.title.toLowerCase().includes(q) || p._id.includes(q));
  }
  if (cat !== 'all') {
    filtered = filtered.filter(p => p.category === cat);
  }
  if (stock !== 'all') {
    if (stock === 'instock') filtered = filtered.filter(p => p.stock > 0);
    else if (stock === 'lowstock') filtered = filtered.filter(p => p.stock > 0 && p.stock <= 5);
    else if (stock === 'outofstock') filtered = filtered.filter(p => p.stock === 0);
  }

          </div>
        </td>
        <td>
          <div class="table-quick-edit">
            <input type="number" class="sp-qe-input tblStockInput" data-id="${p._id}" value="${p.stock}" min="0" ${!canUpdateStock ? 'disabled' : ''} style="padding:4px 6px; width:65px"/>
            ${canUpdateStock ? `<button class="sp-mini-btn tblSaveBtn" data-id="${p._id}" style="min-height:30px; padding:4px 10px">Save</button>` : ''}
          </div>
          <div style="margin-top:6px"><span class="sp-chip" style="${stockPillStyle}">${stockStatusLabel}</span></div>
        </td>
        <td>
          ${statusPill(p.status)}
        </td>
        <td style="text-align: right">
          <div style="display:flex; justify-content:flex-end; gap:6px">
            <button class="sp-mini-btn tblEditBtn" data-id="${p._id}" ${!canEdit ? 'disabled' : ''}>Full Edit</button>
            <button class="sp-mini-btn sp-mini-btn--danger tblDelBtn" data-id="${p._id}" ${!canDelete ? 'disabled style="opacity:0.5"' : ''}>Remove</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
  
  // Bind actions
  tbody.querySelectorAll('.tblEditBtn').forEach(b => b.onclick = () => openProductForm(state.products.find(p => p._id === b.dataset.id)));
  tbody.querySelectorAll('.tblSaveBtn').forEach(b => b.onclick = () => quickSavePriceStockTable(b.dataset.id, b));
  tbody.querySelectorAll('.tblDelBtn').forEach(b => b.onclick = async () => { 
    if (confirm('Remove this product?')) { 
      await api('/products/' + b.dataset.id, { method: 'DELETE' }); 
      loadStaffProducts(); 
    } 
  });
}

async function quickSavePriceStock(id, btn) {
  const row = btn.closest('.sp-quick-edit');
  const priceEl = row.querySelector('.qePriceInput');
  const stockEl = row.querySelector('.qeStockInput');
  const orig = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  try {
    const fd = new FormData();
    fd.append('price', priceEl.value);
    fd.append('stock', stockEl.value);
    const cur = state.products.find(p => p._id === id);
    if (cur) {
      fd.append('title', cur.title);
      fd.append('description', cur.description || '');
      fd.append('colour', cur.colour || '');
      fd.append('size', cur.size || '');
      fd.append('category', cur.category || 'other');
    }
    await api('/products/' + id, { method: 'PUT', body: fd });
    btn.textContent = '✓'; btn.style.background = '#1e7a34'; btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; }, 1500);
    if (cur) { cur.price = Number(priceEl.value); cur.stock = Number(stockEl.value); }
  } catch(err) {
    btn.textContent = '!'; btn.style.background = '#b3261e'; btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; }, 2000);
  }
}

const KNOWN_COLOR_PALETTE = {
  'pink': '#E8A4A4', 'rose': '#E8A4A4', 'rose pink': '#E8A4A4', 'blush': '#F3C5C5', 'blush pink': '#F3C5C5',
  'black': '#1C1917', 'midnight black': '#1C1917', 'obsidian': '#1C1917',
  'gold': '#C9A96E', 'champagne': '#C9A96E', 'champagne gold': '#C9A96E',
  'ivory': '#F5F0E8', 'white': '#FFFFFF', 'off-white': '#FAFAF7',
  'green': '#8B9E7A', 'sage': '#8B9E7A', 'sage green': '#8B9E7A', 'emerald': '#1e7a34', 'emerald green': '#1e7a34',
  'blue': '#1E3A5F', 'navy': '#1E3A5F', 'navy blue': '#1E3A5F', 'royal blue': '#1952a5',
  'maroon': '#8B2240', 'deep maroon': '#8B2240', 'wine': '#722F37', 'burgundy': '#800020',

  'mocha': '#826644', 'violet': '#8a2be2', 'purple': '#6a0dad', 'lilac': '#C8A2C8', 'lavender': '#E6E6FA'
};

function guessColorHex(name) {
  if (!name) return '#1C1917';
  const clean = name.toLowerCase().trim();
  if (KNOWN_COLOR_PALETTE[clean]) return KNOWN_COLOR_PALETTE[clean];
  for (const k in KNOWN_COLOR_PALETTE) {
    if (clean.includes(k)) return KNOWN_COLOR_PALETTE[k];
  }
  return '#1C1917';
}

/* simple client-side crop tool: drag box + resize handle */
function handleImageSelect(files) {
  const cropArea = document.getElementById('cropArea');
  cropArea.innerHTML = ''; cropImages = [];
  [...files].forEach((file, idx) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const wrap = document.createElement('div');
        wrap.className = 'sp-crop-wrap';
        wrap.style.width = '260px'; wrap.style.height = (260 * img.height / img.width) + 'px';
        wrap.innerHTML = `<img src="${e.target.result}" class="sp-crop-img"/>
          <div class="sp-crop-box" style="left:10%;top:10%;width:80%;height:80%;"><div class="sp-crop-handle"></div></div>`;
        cropArea.appendChild(wrap);
        const record = { file, naturalW: img.width, naturalH: img.height, cropBox: null };
        cropImages[idx] = record;
        setupCropDrag(wrap, wrap.querySelector('.sp-crop-box'), record);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function setupCropDrag(container, box, record) {
  let dragging = null, start = {};
  function updateBox() {
    const cRect = container.getBoundingClientRect(), bRect = box.getBoundingClientRect();
    const scaleX = record.naturalW / cRect.width, scaleY = record.naturalH / cRect.height;
    record.cropBox = { left: (bRect.left - cRect.left) * scaleX, top: (bRect.top - cRect.top) * scaleY, width: bRect.width * scaleX, height: bRect.height * scaleY };
  }
  box.addEventListener('pointerdown', (e) => {
    dragging = e.target.classList.contains('sp-crop-handle') ? 'resize' : 'move';
    start = { x: e.clientX, y: e.clientY, left: box.offsetLeft, top: box.offsetTop, w: box.offsetWidth, h: box.offsetHeight };
    e.preventDefault();
  });
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (dragging === 'move') {
      box.style.left = Math.max(0, Math.min(container.clientWidth - box.offsetWidth, start.left + dx)) + 'px';
      box.style.top = Math.max(0, Math.min(container.clientHeight - box.offsetHeight, start.top + dy)) + 'px';
    } else {
      box.style.width = Math.max(30, Math.min(container.clientWidth - box.offsetLeft, start.w + dx)) + 'px';
      box.style.height = Math.max(30, Math.min(container.clientHeight - box.offsetTop, start.h + dy)) + 'px';
    }
    updateBox();
  });
  window.addEventListener('pointerup', () => { if (dragging) updateBox(); dragging = null; });
  updateBox();
}

          const readFileAsDataUrl = (file) => new Promise(res => {
            const r = new FileReader();
            r.onload = e => res(e.target.result);
            r.readAsDataURL(file);
          });

          let mainImgUrl = fixDriveUrl((document.getElementById('cp_main_image').value || '').trim());
          let side1ImgUrl = fixDriveUrl((document.getElementById('cp_side1_image').value || '').trim());
          let side2ImgUrl = fixDriveUrl((document.getElementById('cp_side2_image').value || '').trim());

          if (mainFile) mainImgUrl = await readFileAsDataUrl(mainFile);

          if (side2File) side2ImgUrl = await readFileAsDataUrl(side2File);

            eyebrow: document.getElementById('cp_eyebrow').value,
            title: document.getElementById('cp_title').value,
            
            main_image: mainImgUrl,
            main_badge: document.getElementById('cp_main_badge').value,

            side2_image: side2ImgUrl,

            quote_text: document.getElementById('cp_quote_text').value,
            quote_author: document.getElementById('cp_quote_author').value,

            const formData = new FormData();
            formData.append('visible', visible);
            formData.append('config', JSON.stringify(config));
            if (mainFile) formData.append('main_image', mainFile);
            if (side1File) formData.append('side1_image', side1File);
            if (side2File) formData.append('side2_image', side2File);

            await api('/cms/admin/sections/poster_spread', { method: 'PUT', body: formData });
          } else {
            await api('/cms/admin/sections/poster_spread', { method: 'PUT', body: { visible, config } });

          alert('Campaign Poster Spread configuration saved!');

      </div>
    </div>
  </div>

  <!-- Drop Zone -->
  <div class="bi-zone" id="biDropZone">
    <span class="bi-zone__icon">🗂️</span>
    <div class="bi-zone__title">Drag & Drop your Excel or CSV file here</div>
    <div class="bi-zone__hint">Supports .xlsx, .xls, and .csv — up to 10 MB</div>
    <div class="bi-zone__or">— or —</div>
    <label class="bi-file-pick" for="biFileInput">📂 Choose File</label>
    <input type="file" id="biFileInput" accept=".xlsx,.xls,.csv" style="display:none"/>
    <div id="biFileName" style="margin-top:12px;font-size:0.8rem;color:#15803d;font-weight:600"></div>
  </div>

  <!-- Preview Panel (hidden until file loaded) -->
  <div class="bi-preview" id="biPreview">
    <div class="bi-preview-head">
      <div class="bi-preview-head__title" id="biPreviewTitle">Preview</div>
      <div class="bi-stats">
        <span class="bi-stat bi-stat--ok" id="biStatOk">0 valid</span>
        <span class="bi-stat bi-stat--warn" id="biStatSkip">0 skipped</span>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table class="bi-preview-table">
        <thead>
          <tr>
            <th>#</th><th>Title</th><th>Price (₹)</th><th>Stock</th><th>Colour</th><th>Size</th><th>Category</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="biPreviewBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="bi-actions" id="biActions" style="display:none">
    <button class="bi-import-btn" id="biImportBtn">⬆ Import Products to Shop</button>
    <button class="bi-clear-btn" id="biClearBtn">✕ Clear &amp; Re-select</button>
  </div>

  <!-- Result Box -->
  <div class="bi-result" id="biResult">
    <div class="bi-result__title" id="biResultTitle"></div>
    <div class="bi-result__list" id="biResultList"></div>
  </div>
  `;

  // ── State ──────────────────────────────────────────────────
  let parsedRows = []; // { title, price, stock, colour, size, category, desc, images, _valid, _error }
  const VALID_CATS = ['party','ethnic','casual','maxi','coord','workwear','other'];

  function normaliseCat(raw) {
    const c = (raw || '').toLowerCase().replace(/[^a-z]/g,'');
    return VALID_CATS.find(v => c.includes(v)) || 'other';
  }

  function parseFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const data = new Uint8Array(e.target.result);
      let wb;
      try {
        wb = XLSX.read(data, { type: 'array' });
      } catch(err) {
        showResult(false, 'Could not parse file: ' + err.message, []);
        return;
      }
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });

      if (!raw.length) {
        showResult(false, 'The sheet appears to be empty.', []);
        return;
      }

      function col(row, ...names) {
        for (const n of names) {
          const key = Object.keys(row).find(k => k.trim().toLowerCase() === n.toLowerCase());
          if (key !== undefined && row[key] !== '' && row[key] !== null) return String(row[key]).trim();
        }
        return '';
      }

      parsedRows = raw.map((row, i) => {
        const title    = col(row, 'title','name','product name','product title');
        const priceStr = col(row, 'price','mrp','selling price','rate');
        const stockStr = col(row, 'stock','quantity','qty','inventory');
        const colour   = col(row, 'colour','color','colours','colors');
        const size     = col(row, 'size','sizes','available sizes');
        const rawCat   = col(row, 'category','type','product type');
        const desc     = col(row, 'description','desc','details');
        const imgStr   = col(row, 'images','image','image url','image urls','photos','photo');
        const price    = parseFloat(priceStr);
        const stock    = parseInt(stockStr, 10);
        const images   = imgStr ? imgStr.split(/[,;\n]+/).map(u=>u.trim()).filter(u=>u.startsWith('http')) : [];

        let _valid = true; let _error = '';
        if (!title) { _valid = false; _error = 'Missing title'; }
        else if (isNaN(price) || price <= 0) { _valid = false; _error = `Bad price: "${priceStr}"`; }

        return {
          _rowNum: i + 2, title, price: isNaN(price)?0:price,
          stock: isNaN(stock)?0:Math.max(0,stock),
          colour, size, category: normaliseCat(rawCat), desc, images, _valid, _error
        };
      });

      renderPreview();
    };
    reader.readAsArrayBuffer(file);
  }

  function renderPreview() {
    const valid  = parsedRows.filter(r => r._valid);
    const skipped = parsedRows.filter(r => !r._valid);

    document.getElementById('biPreviewTitle').textContent =
      `Preview — ${parsedRows.length} row${parsedRows.length!==1?'s':''} detected`;
    document.getElementById('biStatOk').textContent   = valid.length   + ' valid';
    document.getElementById('biStatSkip').textContent = skipped.length + ' skipped';
    document.getElementById('biPreview').style.display = 'block';
    document.getElementById('biActions').style.display = 'flex';
    document.getElementById('biResult').style.display  = 'none';

    const tbody = document.getElementById('biPreviewBody');
    tbody.innerHTML = parsedRows.map(r => `
      <tr class="${r._valid?'':'row-error'}">
        <td style="color:#9ca3af">${r._rowNum}</td>
        <td><strong>${r._valid ? (r.title||'—') : ('⚠ '+r._error)}</strong></td>
        <td>${r._valid ? '₹'+r.price.toLocaleString('en-IN') : '—'}</td>
        <td>${r.stock}</td>
        <td>${r.colour||'—'}</td>
        <td style="font-size:0.72rem">${r.size||'—'}</td>
        <td><span class="bi-cat-pill">${r.category}</span></td>
        <td>${r._valid
          ? '<span style="color:#16a34a;font-weight:700">✓ Ready</span>'
          : '<span style="color:#dc2626;font-weight:700">✗ Skipped</span>'}</td>
      </tr>
    `).join('');
  }

  function showResult(ok, title, errors) {
    const el = document.getElementById('biResult');
    el.className = 'bi-result ' + (ok ? 'bi-result--ok' : 'bi-result--err');
    el.style.display = 'block';
    document.getElementById('biResultTitle').textContent = title;
    document.getElementById('biResultList').innerHTML = errors.map(e => `• ${e}`).join('<br/>');
  }

  // ── Download sample template ──────────────────────────────
  document.getElementById('biDownloadTemplate').onclick = () => {
    const headers = ['Title','Price','Stock','Colour','Size','Category','Description','Images'];
    const sample = [
      ['Chiffon Floral Dress', 4999, 20, 'Blush Pink', 'S, M, L', 'casual', 'Flowy floral print chiffon perfect for summer.', ''],
      ['Velvet Lehenga Set',   24500, 8,  'Maroon',     'M, L',    'ethnic', 'Heavy embroidered velvet lehenga for weddings.', ''],
      ['Party Jumpsuit',       6999, 15, 'Black',      'XS, S, M, L', 'party', 'Sleek wide-leg jumpsuit for evenings.',       '']
    ];
    const ws  = XLSX.utils.aoa_to_sheet([headers, ...sample]);
    const wb2 = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb2, ws, 'Products');
    XLSX.writeFile(wb2, 'TAVUSHA_Product_Import_Template.xlsx');
  };

  // ── File input / drag-drop ────────────────────────────────
  const zone = document.getElementById('biDropZone');
  const inp  = document.getElementById('biFileInput');

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) handleFilePicked(file);
  });
  inp.addEventListener('change', () => {
    if (inp.files[0]) handleFilePicked(inp.files[0]);
  });

  function handleFilePicked(file) {
    document.getElementById('biFileName').textContent = '📄 ' + file.name;
    parsedRows = [];
    document.getElementById('biPreview').style.display = 'none';
    document.getElementById('biActions').style.display = 'none';
    document.getElementById('biResult').style.display  = 'none';
    parseFile(file);
  }

  // ── Clear ─────────────────────────────────────────────────
  document.getElementById('biClearBtn').onclick = () => {
    parsedRows = [];
    inp.value = '';
    document.getElementById('biFileName').textContent = '';
    document.getElementById('biPreview').style.display  = 'none';
    document.getElementById('biActions').style.display  = 'none';
    document.getElementById('biResult').style.display   = 'none';
  };

  // ── Import ────────────────────────────────────────────────
  document.getElementById('biImportBtn').onclick = async () => {
    const validRows = parsedRows.filter(r => r._valid);
    if (!validRows.length) {
      showResult(false, 'No valid rows to import.', []);
      return;
    }

    const btn = document.getElementById('biImportBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="sp-spinner" style="width:16px;height:16px;border-width:2px;border-color:#fff;border-top-color:transparent;display:inline-block;border-radius:50%;animation:spin .8s linear infinite"></span> Importing…';

    if (state.isDemo) {
      // ── Demo / offline mode: import to localStorage ──────────
      const prods = getLocal('sp_demo_products', DEFAULT_MOCK_PRODS);
      let imported = 0; const errors = [];
      for (const r of validRows) {
        try {
          const newP = {
            _id: 'bulk_' + Date.now() + '_' + imported,
            title: r.title, price: r.price, stock: r.stock,
            colour: r.colour, size: r.size, category: r.category,
            description: r.desc, status: 'approved',
            images: r.images.length ? r.images : ['https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400'],
            created_at: new Date().toISOString()
          };
          prods.unshift(newP);
          imported++;
        } catch(e) {
          errors.push(r.title + ': ' + e.message);
        }
      }
      setLocal('sp_demo_products', prods);
      btn.disabled = false;
      btn.innerHTML = '⬆ Import Products to Shop';
      const skipped = validRows.length - imported + parsedRows.filter(r=>!r._valid).length;
      showResult(true,
        `✅ ${imported} product${imported!==1?'s':''} imported successfully (demo mode)!`,
        errors.concat(parsedRows.filter(r=>!r._valid).map(r=>`Row ${r._rowNum}: ${r._error}`))
      );
      return;
    }

    // ── Live backend mode: upload file to /api/products/bulk-import ──
    try {
      const file = inp.files[0];
      if (!file) { showResult(false, 'Please select a file first.', []); btn.disabled=false; btn.innerHTML='⬆ Import Products to Shop'; return; }
      const fd = new FormData();
      fd.append('excel', file);
      const result = await api('/products/bulk-import', { method: 'POST', body: fd });
      btn.disabled = false;
      btn.innerHTML = '⬆ Import Products to Shop';
      showResult(true,
        `✅ ${result.imported} product${result.imported!==1?'s':''} imported! ${result.skipped?result.skipped+' row(s) skipped.':''}`,
        result.errors || []
      );
      state.products = await api('/products');
    } catch(err) {
      btn.disabled = false;
      btn.innerHTML = '⬆ Import Products to Shop';
      showResult(false, 'Import failed: ' + err.message, []);
    }
  };
}

      <input id="b_fest_tag" placeholder="e.g. Diwali" class="sp-input" value="${banner ? esc(banner.festival_tag) : ''}"/>
    ` : ''}

    <label class="sp-field-label">Banner Photo *</label>
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:12px;">
      <img id="b_image_preview" src="${initialImg}" style="width:70px; height:70px; object-fit:cover; border-radius:6px; border:1px solid #ccc; flex-shrink:0; ${initialImg ? '' : 'display:none;'}">
      <div style="flex:1;">
        <input type="file" id="b_image_file" accept="image/*" class="sp-input" style="padding:4px; font-size:0.8rem; margin-bottom:6px;"/>
        <input id="b_image_url" placeholder="Or paste Image / Google Drive URL" class="sp-input" value="${banner ? esc(banner.image_url) : ''}"/>
      </div>
    </div>

    <label class="sp-toggle-row">
      <span class="sp-field-label" style="margin:0">Visible / Active</span>
      <div class="sp-switch">
        <input type="checkbox" id="b_visible" ${(!banner || banner.visible !== false) ? 'checked' : ''}/>
        <span class="sp-switch__track"></span>
      </div>
    </label>

    <button id="saveBannerBtn" class="btn-pill sp-btn-block sp-save-btn">Save Banner</button>
  `;

  const fileInp = document.getElementById('b_image_file');
  const urlInp = document.getElementById('b_image_url');
  const imgPrev = document.getElementById('b_image_preview');

  if (fileInp) {
    fileInp.onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          imgPrev.src = ev.target.result;
          imgPrev.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    };
  }

  if (urlInp) {
    urlInp.oninput = () => {
      const fixed = fixDriveUrl(urlInp.value.trim());
      if (fixed) {
        imgPrev.src = fixed;
        imgPrev.style.display = 'block';
      } else if (!fileInp.files || !fileInp.files[0]) {
        imgPrev.style.display = 'none';
      }
    };
  }

  document.getElementById('closeForm').onclick = closeForm;
  document.getElementById('saveBannerBtn').onclick = async () => {
    const saveBtn = document.getElementById('saveBannerBtn');
    const msg = document.getElementById('formMsg');
    const title = document.getElementById('b_title').value.trim();
    let image_url = fixDriveUrl(document.getElementById('b_image_url').value.trim());
    const file = fileInp?.files?.[0];

    if (!title) {
      msg.textContent = 'Banner Title is required.';
      msg.className = 'sp-form-msg sp-form-msg--error';
      return;
    }

    if (!image_url && !file) {
      msg.textContent = 'Please choose an image file or enter an image URL.';
      msg.className = 'sp-form-msg sp-form-msg--error';
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving Banner...';

    try {
      let finalImageUrl = image_url;
      if (file) {
        finalImageUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      }

      const visible = document.getElementById('b_visible').checked;
      const subtitle = document.getElementById('b_sub').value;
      const badge_text = document.getElementById('b_badge').value;
      const cta_text = document.getElementById('b_cta_text').value;
      const cta_url = document.getElementById('b_cta_url').value;
      const festival_tag = type === 'festival' ? (document.getElementById('b_fest_tag')?.value || '') : '';

      if (file) {
        const fd = new FormData();
        fd.append('type', type || 'hero');
        fd.append('title', title);
        fd.append('subtitle', subtitle);
        fd.append('badge_text', badge_text);
        fd.append('cta_text', cta_text);
        fd.append('cta_url', cta_url);
        fd.append('visible', visible);
        if (festival_tag) fd.append('festival_tag', festival_tag);
        fd.append('image', file);

        if (isEdit) {
          await api('/cms/admin/banners/' + banner.id, { method: 'PUT', body: fd });
        } else {
          await api('/cms/admin/banners', { method: 'POST', body: fd });
        }

        // Upload to site_settings banner endpoint for bucket 'banners' persistence and log responses
        try {
          const settingFd = new FormData();
          settingFd.append('banner', file);
          const postRes = await api('/cms/admin/site-settings/banner', { method: 'POST', body: settingFd });
          console.log('[POST /api/cms/admin/site-settings/banner Response JSON]:', postRes);
          console.log(JSON.stringify(postRes, null, 2));

          const getRes = await api('/cms/site-settings/banner', { method: 'GET' });
          console.log('[GET /api/cms/site-settings/banner Response JSON]:', getRes);
          console.log(JSON.stringify(getRes, null, 2));
        } catch (e) {
          console.warn('Site setting banner sync notice:', e.message);
        }
      } else {
        const body = {
          type: type || 'hero',
          title, subtitle, badge_text, cta_text, cta_url,
          image_url: finalImageUrl || image_url,
          visible, festival_tag
        };
        if (isEdit) {
          await api('/cms/admin/banners/' + banner.id, { method: 'PUT', body });
        } else {
          await api('/cms/admin/banners', { method: 'POST', body });
        }

        if (image_url || finalImageUrl) {
          try {
            const postRes = await api('/cms/admin/site-settings/banner', { method: 'POST', body: { banner_url: finalImageUrl || image_url } });
            console.log('[POST /api/cms/admin/site-settings/banner Response JSON]:', postRes);
            console.log(JSON.stringify(postRes, null, 2));

            const getRes = await api('/cms/site-settings/banner', { method: 'GET' });
            console.log('[GET /api/cms/site-settings/banner Response JSON]:', getRes);
            console.log(JSON.stringify(getRes, null, 2));
          } catch(e) {}
        }
      }

      await syncOfflineCmsData();
      closeForm();
      showAdminTab('cms');
    } catch (err) {
      msg.textContent = err.message || 'Failed to save banner';
      msg.className = 'sp-form-msg sp-form-msg--error';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Banner';
    }
  };
}

/* ---- Auto-generate helpers ---- */
function genId(name) {
  const clean = (name || 'staff').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);
  return 'staff.' + clean + Math.floor(10 + Math.random() * 90);
}
function genPassword() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#!';
  return Array.from({length: 10}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
}

function updatePwStrength(pw) { updatePwStrengthEl('pwStrength', pw); }
function updatePwStrengthEl(elId, pw) {
  const el = document.getElementById(elId); if(!el) return;
  if(!pw) { el.innerHTML = ''; return; }
  const score = [pw.length >= 8, /[A-Z]/.test(pw), /[0-9]/.test(pw), /[^A-Za-z0-9]/.test(pw)].filter(Boolean).length;
  const labels = ['','Weak','Fair','Good','Strong'];
  const colors = ['','#b3261e','#e08000','#2d7a4e','#1a5c38'];
  el.innerHTML = `<div class="sp-pw-bar"><div class="sp-pw-fill" style="width:${score*25}%;background:${colors[score]}"></div></div><span style="font-size:0.7rem;color:${colors[score]}">${labels[score]}</span>`;
}

function stepProdTableStock(id, delta) {
  const input = document.querySelector(`.tblStockInput[data-id="${id}"]`);
  if (!input) return;
  const current = Math.max(0, parseInt(input.value || '0', 10));
  input.value = Math.max(0, current + delta);
}

async function quickSavePriceStockTable(id, btn) {
  const row = btn.closest('tr');
  const priceEl = row.querySelector('.tblPriceInput');
  const stockEl = row.querySelector('.tblStockInput');
  const orig = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  try {
    const fd = new FormData();
    fd.append('price', priceEl.value);
    fd.append('stock', stockEl.value);
    const cur = state.products.find(p => p._id === id);
    if (cur) {
      fd.append('title', cur.title);
      fd.append('description', cur.description || '');
      fd.append('colour', cur.colour || '');
      fd.append('size', cur.size || '');
      fd.append('category', cur.category || 'other');
      cur.price = Number(priceEl.value);
      cur.stock = Number(stockEl.value);
      if (Array.isArray(cur.colorVariants) && cur.colorVariants.length === 1) {
        cur.colorVariants[0].stock = Number(stockEl.value);
      }
    }
    await api('/products/' + id, { method: 'PUT', body: fd });
    
    // Always persist to local demo store for live customer cart limitation
    const prods = getLocal('sp_demo_products', state.products);
    const idx = prods.findIndex(p => p._id === id);
    if (idx !== -1) {
      prods[idx].price = Number(priceEl.value);
      prods[idx].stock = Number(stockEl.value);
      if (Array.isArray(prods[idx].colorVariants) && prods[idx].colorVariants.length === 1) {
        prods[idx].colorVariants[0].stock = Number(stockEl.value);
      }
      setLocal('sp_demo_products', prods);
    }

    btn.textContent = '✓'; btn.style.background = '#1e7a34'; btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; renderFilteredProductsTable(); }, 800);
  } catch(err) {
    btn.textContent = '!'; btn.style.background = '#b3261e'; btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; }, 2000);
  }
}

async function quickSaveInventoryRow(id, btn) {
  const input = document.querySelector(`.invStockInput[data-id="${id}"]`);
  if (!input) return;
  const newStock = Math.max(0, parseInt(input.value || '0', 10));
  const orig = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;

  try {
    const cur = state.products.find(p => p._id === id);
    const fd = new FormData();
    fd.append('stock', newStock);
    if (cur) {
      fd.append('title', cur.title);
      fd.append('price', cur.price);
      fd.append('description', cur.description || '');
      fd.append('colour', cur.colour || '');
      fd.append('size', cur.size || '');
      fd.append('category', cur.category || 'other');
      cur.stock = newStock;
      if (Array.isArray(cur.colorVariants) && cur.colorVariants.length === 1) {
        cur.colorVariants[0].stock = newStock;
      }
    }

    await api('/products/' + id, { method: 'PUT', body: fd });

    // Sync with local products database
    const prods = getLocal('sp_demo_products', state.products);
    const idx = prods.findIndex(p => p._id === id);
    if (idx !== -1) {
      prods[idx].stock = newStock;
      if (Array.isArray(prods[idx].colorVariants) && prods[idx].colorVariants.length === 1) {
        prods[idx].colorVariants[0].stock = newStock;
      }
      setLocal('sp_demo_products', prods);
    }

    btn.textContent = '✓ Saved';
    btn.style.background = '#1e7a34';
    btn.style.color = '#fff';

    // Update stats dynamically
    const totalUnits = state.products.reduce((sum, p) => sum + (Number(p.stock) || 0), 0);
    const inStockCount = state.products.filter(p => (Number(p.stock) || 0) > 5).length;
    const lowStockCount = state.products.filter(p => (Number(p.stock) || 0) > 0 && (Number(p.stock) || 0) <= 5).length;
    const outOfStockCount = state.products.filter(p => (Number(p.stock) || 0) === 0).length;

    const elTotal = document.getElementById('statTotalUnits');
    const elIn = document.getElementById('statInStock');
    const elLow = document.getElementById('statLowStock');
    const elOut = document.getElementById('statOutStock');

    if (elTotal) elTotal.textContent = totalUnits;
    if (elIn) elIn.textContent = inStockCount;
    if (elLow) elLow.textContent = lowStockCount;
    if (elOut) elOut.textContent = outOfStockCount;

    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '';
      btn.style.color = '';
      btn.disabled = false;
      renderFilteredInventoryTable();
    }, 900);
  } catch(err) {
    btn.textContent = '! Error';
    btn.style.background = '#b3261e';
    btn.style.color = '#fff';
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '';
      btn.style.color = '';
      btn.disabled = false;
    }, 2000);
  }
}

async function restockAllOutOfStock() {
  const outOfStockList = state.products.filter(p => (Number(p.stock) || 0) === 0);
  if (outOfStockList.length === 0) {
    alert('All products already have stock!');
    return;
  }

  if (!confirm(`Restock all ${outOfStockList.length} out-of-stock products to 10 pieces each?`)) return;

  const btn = document.getElementById('restockOutBtn');
  if (btn) { btn.textContent = '⏳ Restocking...'; btn.disabled = true; }

  for (const prod of outOfStockList) {
    prod.stock = 10;
    if (Array.isArray(prod.colorVariants) && prod.colorVariants.length === 1) {
      prod.colorVariants[0].stock = 10;
    }
    const fd = new FormData();
    fd.append('stock', 10);
    fd.append('title', prod.title);
    fd.append('price', prod.price);
    await api('/products/' + prod._id, { method: 'PUT', body: fd }).catch(() => {});
  }

  // Update localStorage
  const prods = getLocal('sp_demo_products', state.products);
  prods.forEach(p => {
    if ((Number(p.stock) || 0) === 0) p.stock = 10;
  });
  setLocal('sp_demo_products', prods);

  if (btn) { btn.textContent = '✓ Done!'; btn.style.background = '#1e7a34'; }
  setTimeout(() => { showAdminTab('inventory'); }, 800);
}

}

          <div class="address" style="font-size: 1.1rem; font-weight: bold;">
            <strong>SHIP TO:</strong>
            ${order.customer_name}<br>
            ${dAddr.line1 || ''}<br>
            ${dAddr.city || ''}, ${dAddr.state || ''} - ${order.pincode || ''}<br>
            <span style="font-size: 0.9rem; font-weight: normal; display: inline-block; margin-top: 4px;">Phone: ${order.customer_phone || ''}</span>
          </div>
          <div class="address">
            <strong>FROM (RETURN ADDRESS):</strong>
            Tavusha Fulfillment Center<br>
            Sector 15, Noida, UP - 201301
          </div>
          <div class="barcode">
            ||| || ||| || ||| || ||| || | |||<br>
            ${order.tracking_number || order.order_number}
          </div>
          <p style="text-align:center; font-size: 0.75rem; border-top: 1px dashed #000; padding-top: 10px; margin-bottom: 0;">
            ORDER: ${order.order_number} | PAY: ${order.payment_type === 'cod' ? 'COD' : 'PREPAID'} | WGT: 0.5kg
          </p>
        </div>
        <script>
          window.onload = () => { setTimeout(() => { window.print(); }, 500); };
        <\/script>
      </body>
    </html>
  `);
  printWindow.document.close();
}

async function syncOfflineCmsData() {
  try {
    const banners = await api('/cms/admin/banners');
    const sections = await api('/cms/sections');
    const popups = await api('/cms/admin/popups');

    // Announcement text
    const annSec = sections.find(s => s.key === 'announcement');
    const annText = annSec?.config?.text || '';

    // Active popup
    const activePop = popups.find(p => p.visible);

    // Store sections as a plain array so main.js can read them directly.
    // Each entry keeps its original key, visible flag, and full config.
    const sectionsArray = sections.map(s => ({
      key: s.key,
      label: s.label || s.key,
      visible: s.visible !== false,
      sort_order: s.sort_order || 0,
      config: s.config || {}
    }));

    // All banners (hero + festival) stored as a flat array
    const allBanners = Array.isArray(banners) ? banners.filter(b => b.visible !== false) : [];
    const heroBanners = allBanners.filter(b => b.type === 'hero' || !b.type);
    const festivalBanners = allBanners.filter(b => b.type === 'festival');

    const cmsPayload = {
      _ts: Date.now(),          // version stamp so homepage detects fresh data
      announcement: annText,
      banners: allBanners,
      heroBanners,
      festivalBanners,
      sections: sectionsArray,  // array, not object — matches main.js expectations
      popup: activePop ? {
        enabled: true,
        title: activePop.title,
        body: activePop.body,
        image_url: activePop.image_url,
        cta_label: activePop.cta_text,
        cta_url: activePop.cta_url,
        delay: activePop.trigger_delay_seconds
      } : { enabled: false }
    };

    localStorage.setItem('cms_data', JSON.stringify(cmsPayload));
  } catch (e) {
    console.warn('syncOfflineCmsData error:', e);
  }
}

render();
</script>
